name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Yardmaster's own CI guard (this repo's action, so pull requests test their own changes to it).
  guard:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { actions: read, contents: read, pull-requests: read, statuses: read }
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: guard
        uses: ./
        with: { allow-skipped: performance }
  test:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # The suite usually takes 2–3 minutes; a stuck job should not bill (or hold) 20 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  performance:
    needs: guard
    if: github.event_name == 'pull_request' && needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Compare scheduler with PR base on an isolated runner
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node bench/compare.mjs "$BASE" > performance.json
          cat performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: scheduler-performance, path: performance.json }
  binary:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-binary.mjs
      - run: sh scripts/smoke-binary.sh release/yardmaster-linux-x64
  # One final job: the check to require, and the one that records a real pass.
  done:
    needs: [guard, test, binary, performance]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { contents: read, statuses: write }
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # The released guard, not this checkout's: code under review never runs with statuses: write.
      - if: needs.guard.outputs.skip != 'true' && needs.test.result == 'success' && needs.binary.result == 'success'
        uses: g4m35/yardmaster@c32f498679fe535257356cf1292064b9ce6229df # v0.5.1
        with: { mode: record }
