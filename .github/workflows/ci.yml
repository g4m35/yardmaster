name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Yardmaster's own CI guard (this repo's action, so pull requests test their own changes to it).
  guard:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { actions: read, contents: read, pull-requests: read, statuses: read }
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: guard
        uses: ./
  test:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # The suite takes under a minute; a stuck job should fail fast, not bill (or hold) 20 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  binary:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-binary.mjs
      - run: sh scripts/smoke-binary.sh release/yardmaster-linux-x64
  # One final job: the check to require, and the one that records a real pass.
  done:
    needs: [guard, test, binary]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { contents: read, statuses: write }
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # The released guard, not this checkout's: code under review never runs with statuses: write.
      - if: needs.guard.outputs.skip != 'true' && !contains(needs.*.result, 'skipped')
        uses: g4m35/yardmaster@c32f498679fe535257356cf1292064b9ce6229df # v0.5.1
        with: { mode: record }
