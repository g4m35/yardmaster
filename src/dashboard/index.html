<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yardmaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C2A28'/%3E%3Ccircle cx='16' cy='10' r='4' fill='%23E0A019'/%3E%3Ccircle cx='16' cy='22' r='4' fill='%232F8A5B'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #ECF0EE;
    --panel: #FFFFFF;
    --panel-2: #F4F7F5;
    --ink: #16211F;
    --ink-2: #44524F;
    --ink-3: #5A6A66;
    --rule: #D3DCD8;
    --rule-2: #AEBBB6;
    --bar: #16211F;
    --bar-ink: #EEF3F1;
    --bar-ink-2: #C5D1CE;
    --bar-rule: #3E504D;
    --amber: #E0A019;
    --amber-ink: #7A5300;
    --amber-wash: #FBF1D9;
    --amber-rule: #E3CB8E;
    --on-amber-wash: #4B3A12;
    --green: #246E49;
    --green-ink: #1F6A43;
    --red: #B3261E;
    --red-wash: #F8E1DF;
    --blue: #235FA0;
    --blue-wash: #E3ECF5;
    --steel: #596B66;
    --steel-wash: #DCE3E1;
    --log-bg: #16211F;
    --log-ink: #D7E2DF;
    --shadow: 0 30px 80px rgba(20, 35, 32, .35);
    --sign: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r-sm: 4px;
    --r-md: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0E1514;
      --panel: #162120;
      --panel-2: #1C2928;
      --ink: #E8EFEC;
      --ink-2: #B7C4C0;
      --ink-3: #95A6A1;
      --rule: #2B3A38;
      --rule-2: #4A5C58;
      --bar: #0A100F;
      --bar-rule: #33433F;
      --amber-ink: #F0BC4E;
      --amber-wash: #33290F;
      --amber-rule: #5C4A1B;
      --on-amber-wash: #F6E7BF;
      --green-ink: #62D29E;
      --red: #FF8E85;
      --red-wash: #3A1917;
      --blue: #86B8F2;
      --blue-wash: #16283B;
      --steel: #93A49F;
      --steel-wash: #1F2B29;
      --log-bg: #0A100F;
      --shadow: 0 30px 80px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: var(--r-sm); }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  h2 { font-family: var(--sign); font-weight: 650; font-size: 17px; margin: 0 0 12px; letter-spacing: .005em; }
  h2 small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 8px; }
  h3 { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
  h4 { margin: 0 0 6px; font-size: 14px; }
  a { color: var(--blue); }
  p { overflow-wrap: anywhere; }
  .muted { color: var(--ink-2); font-size: 13.5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---- top bar ---- */
  header.bar { display: flex; align-items: center; gap: 16px 20px; padding: 12px 28px; background: var(--bar); color: var(--bar-ink); flex-wrap: wrap; border-bottom: 1px solid var(--bar-rule); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--sign); font-size: 20px; letter-spacing: .01em; color: var(--bar-ink); }
  .brand .lamps { display: grid; gap: 3px; }
  .brand .lamps i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .bar select { background: #2A3B38; border: 1px solid var(--bar-rule); border-radius: var(--r-sm); padding: 5px 8px; color: var(--bar-ink); max-width: 100%; }
  .bar .spacer { flex: 1; }
  .meter { display: grid; gap: 4px; min-width: 190px; font-size: 13px; color: var(--bar-ink-2); }
  .meter .bar-track { height: 6px; background: #34463F; border-radius: 3px; overflow: hidden; }
  .meter .fill { height: 100%; background: #3FA774; width: 0; transition: width .4s; }
  .meter .fill.warn { background: var(--amber); }
  .meter .fill.over { background: #E5584E; }
  .meter b { color: #fff; font-weight: 600; }
  .meter small { color: #E9C46A; display: block; }
  .conn { font-size: 13px; color: var(--bar-ink-2); display: flex; align-items: center; gap: 6px; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: #7C8E89; }
  .conn.live i { background: #4CC38A; }
  .bar-acts { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn { border: 1px solid var(--rule-2); background: var(--panel); color: var(--ink); border-radius: var(--r-sm); padding: 6px 12px; cursor: pointer; font-weight: 550; min-height: 38px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #231A04; }
  .btn.primary:hover { background: #EBAE2A; }
  .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.go:hover { background: #2B7F55; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }
  .bar .btn.ghost { background: transparent; color: var(--bar-ink); border-color: var(--bar-rule); }
  .bar .btn.ghost:hover { border-color: #9FB0AC; }
  select { min-height: 38px; }

  main { max-width: 1280px; margin: 0 auto; padding: 22px 28px 64px; display: grid; gap: 22px; }
  main > *, .cols > *, .rail > *, .lead > *, .registry-row > *, .machine > * { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 16px 18px; }

  /* ---- banners ---- */
  .notice { background: var(--amber-wash); color: var(--on-amber-wash); border: 1px solid var(--amber-rule); border-radius: var(--r-md); padding: 12px 16px; }
  .notice p { margin: 0 0 8px; }
  .notice code { background: rgba(0, 0, 0, .08); padding: 1px 5px; border-radius: 3px; }
  .banner { border: 1px solid var(--rule); border-left: 6px solid var(--steel); background: var(--steel-wash); border-radius: var(--r-md); padding: 12px 18px; display: flex; gap: 12px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner b { font-family: var(--sign); font-size: 17px; font-weight: 650; margin-right: 6px; }
  .banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .pause-ask { border-left-color: var(--ink); background: var(--panel); }
  #headsup { border: 1px solid var(--rule); border-left: 6px solid var(--blue); background: var(--blue-wash); border-radius: var(--r-md); padding: 14px 18px; }
  #headsup h2 { margin-bottom: 6px; }
  #headsup ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  #headsup a { color: inherit; text-decoration: none; }
  #headsup a:hover { text-decoration: underline; }

  /* ---- status headline ---- */
  .headline { margin: 2px 0 0; font-family: var(--sign); font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
  .headline-sub { margin: 4px 0 0; color: var(--ink-2); }

  /* ---- needs you ---- */
  #attention { border: 1px solid var(--amber-rule); border-left: 6px solid var(--amber); background: var(--amber-wash); color: var(--on-amber-wash); border-radius: var(--r-md); padding: 14px 18px 6px; }
  #attention h2 { margin-bottom: 2px; }
  #attention h2 small { color: inherit; opacity: .85; }
  .need { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 18px; padding: 12px 0; border-top: 1px solid var(--amber-rule); }
  .need:first-of-type { border-top: 0; }
  .need .t { font-weight: 650; overflow-wrap: anywhere; }
  .need .why { max-width: 78ch; overflow-wrap: anywhere; }
  .need .acts { display: flex; gap: 8px; align-items: start; flex-wrap: wrap; justify-content: end; grid-row: span 2; }

  /* ---- layout: board + rail ---- */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
  .rail, .lead { display: grid; gap: 22px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .section-head h2 { margin: 0; }
  .section-head select { max-width: 100%; padding: 6px 8px; background: var(--panel); border: 1px solid var(--rule-2); border-radius: var(--r-sm); }

  /* ---- the line: five stages with counts ---- */
  .work { padding: 0; overflow: hidden; }
  .work > .section-head { padding: 16px 18px 0; }
  .stages { list-style: none; margin: 0; padding: 4px 18px 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
  .stages::before { content: ""; position: absolute; left: calc(18px + 10%); right: calc(18px + 10%); top: 12px; height: 3px; background: repeating-linear-gradient(90deg, var(--rule-2) 0 10px, transparent 10px 16px); }
  .stage { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 4px; position: relative; text-align: center; min-width: 0; }
  .stage .stop { width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 3px solid var(--rule-2); }
  .stage[data-n="some"][data-s="queued"] .stop { border-color: var(--steel); }
  .stage[data-n="some"][data-s="running"] .stop, .stage[data-n="some"][data-s="verifying"] .stop { border-color: var(--blue); }
  .stage[data-n="some"][data-s="ready"] .stop { border-color: var(--amber); }
  .stage[data-n="some"][data-s="done"] .stop { border-color: var(--green); background: var(--green); }
  .stage-name { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .stage-count { font-family: var(--sign); font-size: 20px; font-weight: 650; line-height: 1; }
  .stage[data-n="none"] .stage-count { color: var(--ink-3); font-weight: 500; }

  /* ---- departure board: one row per task ---- */
  .board { border-top: 1px solid var(--rule); }
  .board-cols, .row { display: grid; grid-template-columns: 136px minmax(0, 1fr) 84px 64px 96px; gap: 4px 16px; align-items: center; }
  .board-cols { padding: 8px 18px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--panel-2); border-bottom: 1px solid var(--rule); }
  .board-cols span:nth-child(n+4) { text-align: right; }
  .group > h3 { padding: 14px 18px 6px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li + li { border-top: 1px solid var(--rule); }
  .group + .group { border-top: 1px solid var(--rule); }
  .row { width: 100%; text-align: left; background: none; border: 0; border-left: 4px solid transparent; padding: 12px 18px 12px 14px; cursor: pointer; }
  .row:hover { background: var(--panel-2); }
  .row:focus-visible { outline-offset: -3px; }
  .row[data-s="running"], .row[data-s="verifying"] { border-left-color: var(--blue); }
  .row[data-s="ready"], .row[data-s="merging"] { border-left-color: var(--amber); }
  .row-status { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; align-items: center; min-width: 0; }
  .row-label { font-weight: 650; }
  .row-sub { grid-column: 2; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .row-main { display: grid; gap: 2px; min-width: 0; }
  .row-main .t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .row-main .d { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .row-main .who { color: var(--ink); font-weight: 550; }
  .row-main .who + .what::before { content: " · "; }
  .row-time, .row-cost { font-size: 13.5px; text-align: right; color: var(--ink-2); white-space: nowrap; }
  .row-time { color: var(--ink); }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--steel); display: inline-block; flex: none; }
  [data-s="running"] > .row-status .lamp, [data-s="running"] > .lamp { background: var(--blue); animation: pulse 1.8s ease-in-out infinite; }
  [data-s="verifying"] > .row-status .lamp, [data-s="verifying"] > .lamp { background: var(--blue); }
  [data-s="ready"] > .row-status .lamp, [data-s="merging"] > .row-status .lamp, [data-s="ready"] > .lamp, [data-s="merging"] > .lamp { background: var(--amber); }
  [data-s="done"] > .row-status .lamp, [data-s="done"] > .lamp { background: var(--green); }
  [data-s="needs_human"] > .lamp, [data-s="failed"] > .lamp { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  .track { display: flex; align-items: center; }
  .track i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--rule-2); margin-left: 12px; position: relative; flex: none; }
  .track i:first-child { margin-left: 0; }
  .track i:not(:first-child)::before { content: ""; position: absolute; right: calc(100% + 2px); top: 50%; width: 12px; height: 2px; margin-top: -1px; background: var(--rule-2); }
  .track i.past { background: var(--ink-3); border-color: var(--ink-3); }
  .track i.past + i::before { background: var(--ink-3); }
  .track i.now { width: 13px; height: 13px; border-width: 3px; border-color: var(--blue); background: var(--panel); }
  .track[data-s="queued"] i.now { border-color: var(--steel); }
  .track[data-s="ready"] i.now, .track[data-s="merging"] i.now { border-color: var(--amber); }
  .track[data-s="done"] i.now { border-color: var(--green); background: var(--green); }
  .board-empty { padding: 30px 18px 34px; display: grid; gap: 8px; justify-items: center; text-align: center; }
  .board-empty strong { font-family: var(--sign); font-size: 18px; }
  .board-empty p { margin: 0; color: var(--ink-2); max-width: 56ch; }
  .board-empty .btn { margin-top: 8px; }
  .board-note { margin: 0; padding: 16px 18px; color: var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none !important; } .meter .fill { transition: none; } }

  /* ---- rail panels ---- */
  .feed { list-style: none; margin: 0; padding: 0; }
  #feed-more { margin-top: 10px; font-size: 14px; }
  .feed li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
  .feed li:first-child { border-top: 0; }
  .feed time { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; min-width: 44px; }
  .feed span { overflow-wrap: anywhere; }
  .feed li[data-l="warn"] span { color: var(--amber-ink); }
  .feed li[data-l="error"] span { color: var(--red); }
  .feed li[data-l="success"] span { color: var(--green-ink); }
  .feed a { color: inherit; text-decoration: none; }
  .feed a:hover { text-decoration: underline; }
  .feed-empty { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .machines { display: grid; gap: 12px; margin: 0 0 12px; }
  .machine { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
  .machine .lamp.on { background: var(--green); }
  .machine .n { font-weight: 600; overflow-wrap: anywhere; }
  .machine .a { grid-column: 2 / -1; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .slots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 100px; }
  .slots i { width: 10px; height: 14px; border-radius: 2px; border: 1px solid var(--steel); }
  .slots i.used { background: var(--blue); border-color: var(--blue); }
  .disk { grid-column: 2 / -1; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
  .disk .track-bar { height: 5px; background: var(--steel-wash); border-radius: 3px; overflow: hidden; }
  .disk .fill { height: 100%; background: var(--steel); }
  .disk.low { color: var(--red); }
  .disk.low .fill { background: var(--red); }
  .clean-list { font-size: 13.5px; margin: 8px 0 12px; padding-left: 18px; color: var(--ink-2); }
  .clean-list li { margin: 3px 0; overflow-wrap: anywhere; }
  .clean-list.keep li::marker { color: var(--amber-ink); }

  /* ---- agents and connections (diagnostics, folded) ---- */
  .connections { padding: 0; }
  .connections > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 18px; cursor: pointer; list-style: none; }
  .connections > summary::-webkit-details-marker { display: none; }
  .connections > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); align-self: center; margin-right: 2px; flex: none; }
  .connections[open] > summary::before { transform: rotate(45deg); }
  .connections > summary h2 { margin: 0; }
  .connections-body { padding: 0 18px 16px; display: grid; gap: 12px; }
  .connections-body > * { margin: 0; }
  .registry-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .registry-row { background: var(--panel-2); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 12px 14px; display: grid; align-content: start; gap: 6px; overflow-wrap: anywhere; }
  .registry-top { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .registry-top strong { font-size: 15px; min-width: 0; }
  .registry-state { flex-shrink: 0; font-size: 13px; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 999px; padding: 0 8px; }
  .registry-row[data-state="stale"] { border-left: 4px solid var(--amber-ink); }
  .registry-row[data-state="stale"] .registry-state { color: var(--amber-ink); border-color: var(--amber-ink); }
  .registry-row p { margin: 0; }
  .registry-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .registry-actions .btn { font-size: 14px; }
  .privacy { margin: 0; }

  /* ---- add work dialog ---- */
  dialog { border: 1px solid var(--rule); border-radius: var(--r-md); padding: 0; width: min(620px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(10, 18, 16, .55); }
  form.add { display: grid; gap: 16px; padding: 22px 24px; }
  form.add h2 { margin: 0; font-size: 20px; }
  form.add label { display: grid; gap: 6px; font-weight: 600; }
  form.add label small { font-weight: 400; color: var(--ink-2); }
  form.add textarea, form.add input[type=text], form.add select, .redirect textarea { width: 100%; border: 1px solid var(--rule-2); border-radius: var(--r-sm); padding: 9px 11px; background: var(--panel-2); color: var(--ink); font-weight: 400; }
  form.add textarea { min-height: 120px; resize: vertical; }
  .choice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 0; padding: 0; margin: 0; }
  .choice legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .choice label { border: 1px solid var(--rule-2); border-radius: var(--r-sm); padding: 8px 10px; font-weight: 500; cursor: pointer; display: grid; gap: 2px; background: var(--panel-2); }
  .choice label small { font-size: 12px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .choice label:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 2px; }
  .form-acts { display: flex; justify-content: end; gap: 10px; flex-wrap: wrap; }
  .form-msg { font-size: 14px; min-height: 1.5em; }

  /* ---- detail drawer ---- */
  dialog.drawer { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(620px, 100%); max-width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; border-width: 0 0 0 1px; }
  dialog.drawer[open] { display: grid; grid-template-rows: minmax(0, auto) auto minmax(0, 1fr); }
  .drawer .head { max-height: 52dvh; overflow: auto; padding: 18px 22px 14px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
  .drawer .head h2 { overflow-wrap: anywhere; font-size: 20px; margin: 0; line-height: 1.25; padding-right: 40px; }
  .drawer .close { position: absolute; top: 12px; right: 14px; border: 0; background: none; color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; min-height: 40px; min-width: 40px; }
  .d-status { display: flex; align-items: center; gap: 8px; font-weight: 650; padding-right: 40px; flex-wrap: wrap; }
  .d-status .row-sub { grid-column: auto; font-weight: 400; font-size: 13.5px; }
  .d-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .d-track li { border-top: 4px solid var(--rule-2); padding-top: 6px; font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
  .d-track li.past { border-top-color: var(--ink-3); color: var(--ink-2); }
  .d-track li.now { border-top-color: var(--blue); color: var(--ink); font-weight: 650; }
  .d-track[data-s="queued"] li.now { border-top-color: var(--steel); }
  .d-track[data-s="ready"] li.now, .d-track[data-s="merging"] li.now { border-top-color: var(--amber); }
  .d-track[data-s="done"] li.now { border-top-color: var(--green); }
  .facts { display: grid; grid-template-columns: minmax(0, 104px) minmax(0, 1fr); gap: 4px 14px; font-size: 14px; margin: 0; }
  .facts dt { color: var(--ink-2); overflow-wrap: anywhere; }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .drawer .acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 22px; border-bottom: 1px solid var(--rule); }
  .drawer .acts:empty { display: none; }
  .drawer .body { overflow: auto; padding: 16px 22px 30px; display: grid; gap: 18px; align-content: start; }
  .drawer .body > details > summary { cursor: pointer; font-weight: 650; font-size: 14px; }
  .drawer .body > details > *:not(summary) { margin-top: 8px; }
  .callout { border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .callout.amber { background: var(--amber-wash); color: var(--on-amber-wash); border-left: 4px solid var(--amber); }
  .callout.red { background: var(--red-wash); border-left: 4px solid var(--red); }
  .callout.plain { background: var(--panel-2); border: 1px solid var(--rule); }
  .files { margin: 0; padding-left: 18px; font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
  .history { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .history li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 4px 0; }
  .history time { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; min-width: 44px; }
  .history span { overflow-wrap: anywhere; }
  .redirect, .scope-edit { display: grid; gap: 6px; }
  .redirect label, .scope-edit label { font-weight: 650; font-size: 14px; }
  .scope-edit input { width: 100%; border: 1px solid var(--rule-2); border-radius: var(--r-sm); padding: 9px 11px; background: var(--panel-2); color: var(--ink); font-family: var(--mono); font-size: 13px; min-height: 38px; }
  .redirect textarea { min-height: 64px; resize: vertical; }
  pre.log { margin: 0; background: var(--log-bg); color: var(--log-ink); border-radius: var(--r-sm); padding: 12px 14px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 46vh; overflow: auto; }
  code.cmd { display: block; font: 12.5px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; user-select: all; }

  /* ---- auth gate ---- */
  .gate { max-width: 560px; width: calc(100% - 32px); margin: 12vh auto; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 28px 30px; overflow-wrap: anywhere; }
  .gate h1 { font-family: var(--sign); margin: 0 0 8px; }
  .gate code { background: var(--panel-2); border: 1px solid var(--rule); padding: 2px 6px; border-radius: 3px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #16211F; color: #fff; border: 1px solid #3E504D; padding: 9px 16px; border-radius: var(--r-sm); font-size: 14px; z-index: 30; max-width: calc(100vw - 32px); }

  @media (max-width: 1040px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
    .choice { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 860px) {
    header.bar { padding: 12px 16px; gap: 12px; }
    header.bar .spacer { display: none; }
    .meter { min-width: 150px; flex: 1; }
    .bar-acts { width: 100%; }
    .bar-acts .btn { flex: 1; }
    .bar select { max-width: 210px; }
    main { padding: 16px 16px 48px; gap: 18px; }
    .headline { font-size: 22px; }
    .board-cols { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "status time cost" "main main main" "track track track"; gap: 6px 12px; }
    .row-status { grid-area: status; }
    .row-main { grid-area: main; }
    .row .track { grid-area: track; }
    .row-time { grid-area: time; }
    .row-cost { grid-area: cost; }
    .stage-name { font-size: 12px; }
    .registry-list { grid-template-columns: minmax(0, 1fr); }
    .need { grid-template-columns: minmax(0, 1fr); }
    .need .acts { grid-row: auto; justify-content: start; order: 3; }
    .drawer .head, .drawer .acts, .drawer .body { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<noscript><p class="gate">This local control dashboard needs JavaScript. Enable it here or use <code>ym status</code> in a terminal.</p></noscript>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<template id="tpl-gate">
  <div class="gate">
    <h1>Open this page from Yardmaster</h1>
    <p id="auth-message">This dashboard needs the access key for your hub. Run this in a terminal and use the link it prints:</p>
    <p><code>ym dashboard</code></p>
    <p class="muted">The key stays in this browser only and is never sent anywhere except your own hub.</p>
  </div>
</template>

<template id="tpl-main">
  <header class="bar">
    <h1 class="brand"><span class="lamps" aria-hidden="true"><i style="background:#E0A019"></i><i style="background:#4CC38A"></i></span>Yardmaster</h1>
    <label><span class="sr">Project</span><select id="project"></select></label>
    <div class="spacer"></div>
    <div class="conn" id="conn" role="status"><i></i><span>Connecting</span></div>
    <div class="meter" id="meter" aria-live="polite">
      <div><b class="num" id="spent">$0</b> spent today <span id="budget-of"></span></div>
      <div class="bar-track"><div class="fill" id="fill"></div></div>
      <small id="burn" hidden></small>
    </div>
    <div class="bar-acts">
      <button class="btn ghost" id="pause-btn" type="button">Pause new work</button>
      <button class="btn primary" id="open-add" type="button">Add work</button>
    </div>
  </header>
  <main id="main">
    <section id="load-state" class="notice" role="status">
      <p id="load-message">Connecting to your personal hub…</p>
      <button class="btn" id="refresh-btn" type="button">Refresh now</button>
    </section>
    <section id="setup" class="notice" hidden aria-label="Set up a project">
      <p>Start with a repository. Run <code>ym init</code> there, then <code>ym connect all</code> to connect supported coding clients. Return here and refresh.</p>
    </section>
    <section id="summary" aria-label="Status">
      <p class="headline" id="summary-line" role="status">Loading your work…</p>
      <p class="headline-sub" id="summary-sub"></p>
    </section>
    <section id="pause-ask" hidden aria-labelledby="pa-h" class="banner pause-ask">
      <div><b id="pa-h">Pause new work?</b> Coding agents can finish, or stop now and keep their work for later. Checks and reviews already running can finish.</div>
      <div class="acts">
        <button class="btn primary" id="pause-soft" type="button">Pause, let them finish</button>
        <button class="btn" id="pause-now" type="button">Pause and stop coding</button>
        <button class="btn" id="pause-cancel" type="button">Keep going</button>
      </div>
    </section>
    <section id="paused" class="banner" hidden role="status">
      <div><b>Paused</b> <span id="paused-by"></span> No new work starts until you resume.</div>
      <div class="acts"><button class="btn go" id="resume-btn" type="button">Resume</button></div>
    </section>
    <section id="attention" hidden aria-labelledby="att-h">
      <h2 id="att-h">Needs you <small id="att-count"></small></h2>
      <div id="att-list"></div>
    </section>
    <section id="headsup" hidden aria-labelledby="hu-h">
      <h2 id="hu-h">Heads up</h2>
      <ul id="hu-list"></ul>
    </section>
    <div class="cols">
      <div class="lead">
      <section class="panel work" aria-labelledby="board-h">
        <div class="section-head"><h2 id="board-h">Work</h2></div>
        <ol class="stages" id="stages" aria-label="Tasks at each stage"></ol>
        <div class="board" id="board"></div>
      </section>
    <details class="panel connections" id="conn-details">
      <summary><h2 id="agents-h">Agents and connections</h2><span class="muted" id="conn-summary"></span></summary>
      <div class="connections-body">
        <div class="section-head">
          <p id="registry-status" class="muted" role="status">Loading connected agents…</p>
          <label><span class="sr">Registry view</span><select id="registry-view"><option value="current">Current connections</option><option value="all">Include recent runs</option></select></label>
        </div>
        <div id="registry" class="registry-list"></div>
        <details id="registry-coverage"><summary>What this view can see</summary>
          <p class="muted">Managed: Yardmaster run records. Observed: connected native sessions. Stale: connection or ownership evidence is out of date. Unconnected: a machine reports an installed client, without a connected session. A heartbeat does not prove a process is alive.</p>
          <p class="muted" id="coverage"></p>
        </details>
      </div>
    </details>
      </div>
      <div class="rail">
        <section class="panel" aria-labelledby="feed-h">
          <h2 id="feed-h">What just happened</h2>
          <ol class="feed" id="feed" aria-live="polite"></ol>
          <button class="btn" id="feed-more" type="button" hidden></button>
        </section>
        <section class="panel" aria-labelledby="mach-h">
          <h2 id="mach-h">Machines</h2>
          <div class="machines" id="machines"></div>
          <p class="muted" id="sessions"></p>
        </section>
        <section class="panel" aria-labelledby="clean-h">
          <h2 id="clean-h">Cleanup</h2>
          <p class="muted">Finished worktrees, merged branches and expired reservations are removed. Review the plan first. Changed or unmerged work is kept when the hub cannot confirm it is safe to remove.</p>
          <div id="clean"></div>
          <div class="registry-actions"><button class="btn" id="clean-preview" type="button">Check what can be removed</button><button class="btn go" id="clean-run" type="button" hidden>Clean up now</button></div>
        </section>
      </div>
    </div>
    <p class="muted privacy">Personal hub · Data and logs come from this hub only. No cloud telemetry. Remote access needs your own private HTTPS or encrypted network; this page does not configure it.</p>
  </main>

  <dialog id="add-dialog" aria-labelledby="add-h">
    <form class="add" id="add-form" method="dialog">
      <h2 id="add-h">Add work</h2>
      <label>What should be done?
        <small>Write it like you would to a colleague. The first sentence becomes the task's name.</small>
        <textarea name="text" required placeholder="Add a dark mode toggle to the settings page and remember the choice"></textarea>
      </label>
      <label>Files it will change <small>Optional. Separate with commas, for example src/settings/**, README.md</small>
        <input type="text" name="files" autocomplete="off">
      </label>
      <fieldset class="choice">
        <legend>Speed and cost</legend>
        <label><input type="radio" name="tier" value="" checked>Let it decide<small>Picks a model size from the request</small></label>
        <label><input type="radio" name="tier" value="cheap">Cheapest<small>Small fixes, docs</small></label>
        <label><input type="radio" name="tier" value="standard">Balanced<small>Most features</small></label>
        <label><input type="radio" name="tier" value="strong">Best quality<small>Tricky or risky work</small></label>
      </fieldset>
      <label>Do this after <small>Optional. Waits until the chosen task is merged.</small>
        <select name="after"><option value="">Start as soon as possible</option></select>
      </label>
      <div class="form-msg" id="add-msg" role="status"></div>
      <div class="form-acts">
        <button class="btn" type="button" id="add-cancel">Cancel</button>
        <button class="btn primary" type="submit" id="add-submit">Queue work</button>
      </div>
    </form>
  </dialog>

  <dialog class="drawer" id="drawer" aria-labelledby="d-title">
    <div class="head">
      <button class="close" id="d-close" type="button" aria-label="Close details">×</button>
      <div class="d-status" id="d-status"></div>
      <h2 id="d-title"></h2>
      <ol class="d-track" id="d-track" hidden></ol>
      <dl class="facts" id="d-facts"></dl>
    </div>
    <div class="acts" id="d-acts"></div>
    <div class="body" id="d-body"></div>
  </dialog>
</template>

<script>
(() => {
  const STAGES = [
    { s: 'queued', name: 'Waiting', match: ['queued'] },
    { s: 'running', name: 'Working', match: ['running'] },
    { s: 'verifying', name: 'Checking', match: ['verifying'] },
    { s: 'ready', name: 'Ready to merge', match: ['ready', 'merging'] },
    { s: 'done', name: 'Done', match: ['done'] },
  ];
  const stageIndex = (status) => STAGES.findIndex((st) => st.match.includes(status));
  // What the latest run is doing inside a stage, in plain words. Unknown phases show nothing.
  const PHASE = { prepare: 'Setting up', setup: 'Installing dependencies', route: 'Choosing a model', agent: 'Coding', collect: 'Saving its work', verify: 'Running checks', review_wait: 'In review', review: 'In review' };
  const LABEL = { queued: 'Waiting', running: 'Working', verifying: 'Checking', ready: 'Ready to merge', merging: 'Merging', done: 'Done', needs_human: 'Needs you', failed: 'Failed', canceled: 'Canceled' };

  // The key arrives in the URL fragment (never sent to servers or logs), then lives in localStorage.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('token');
  if (fromHash) { localStorage.setItem('ym-token', fromHash); history.replaceState(null, '', location.pathname); }
  const token = localStorage.getItem('ym-token');
  const app = document.getElementById('app');
  if (!token) { app.append(document.getElementById('tpl-gate').content.cloneNode(true)); return; }
  app.append(document.getElementById('tpl-main').content.cloneNode(true));

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const usd = (n) => !n ? '$0' : n < 0.01 ? '<$0.01' : '$' + n.toFixed(2);
  const clip = (s, n) => !s ? '' : s.length > n ? s.slice(0, n - 1) + '…' : s;
  const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  // Requests are written as paragraphs; a row needs the gist. Mirrors taskTitle() in src/text.ts for
  // titles stored by older hubs and CLIs, which kept up to 200 characters of the request.
  const shortTitle = (s, max = 96) => {
    const line = String(s || '').replace(/\s+/g, ' ').trim();
    for (const stop of line.matchAll(/[.!?](?=\s+[A-Z0-9"'`(\[])/g)) {
      if (line.slice(0, stop.index).includes(' ')) return clip(line.slice(0, stop.index), max);
    }
    return clip(line, max);
  };
  const shortQuoted = (message) => String(message || '').replace(/"([^"]{97,})"/g, (_, title) => '"' + shortTitle(title) + '"');
  const elapsed = (from) => {
    if (!from || from > Date.now()) return '';
    const m = Math.floor((Date.now() - from) / 60000);
    return m < 1 ? 'under 1m' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  };
  // Agent activity arrives as "<kind> <text>" with absolute worktree paths and environment prefixes.
  const tidyPaths = (text, worktree) => {
    // Only the step into the task's own working copy is noise; "cd packages/web && npm test" says where it ran.
    // A quoted path may hold spaces; an unquoted one cannot. Either must end at the task's own folder.
    const step = (quoted, bare) => new RegExp('cd (?:"' + quoted('"') + '/?"|\'' + quoted('\'') + '/?\'|' + bare + '/?)[ \\t]*(?:;|&&)[ \\t]*', 'g');
    const entered = String(text || '').replace(step((quote) => '/[^' + quote + '\\n]*/t-[0-9a-f]{8,}', '/[^\\s"\']*/t-[0-9a-f]{8,}'), '');
    const exact = worktree ? worktree.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '';
    const plain = (worktree ? entered.replace(step(() => exact, exact), '') : entered)
      .replace(/(?:export )?PATH="[^"\n]*(?:"|…)[ \t]*;?[ \t]*/g, '');
    const local = worktree ? plain.split(worktree + '/').join('').split(worktree).join('its working copy') : plain;
    return local.replace(/\/[^\s"']*\/t-[0-9a-f]{8,}(\/?)/g, (_, slash) => slash ? '' : 'its working copy');
  };
  const tidyActivity = (line) => {
    const text = tidyPaths(line).trim();
    const [kind, ...rest] = text.split(' ');
    const body = rest.join(' ');
    if (kind === 'says') return body;
    if (kind === 'tool') return /^Bash\s*…?$/.test(body) ? 'Running a command' : body.replace(/^Bash /, 'Running: ');
    if (kind === 'edit') return 'Editing ' + body.replace(/^(?:Write|Edit|MultiEdit) /, '');
    if (kind === 'start') return 'Started ' + body.replace(/ in\s*$/, '');
    return text;
  };
  const phaseOf = (t) => {
    if (t.status === 'ready') return t.needsApproval || t.attention ? 'Waiting for your approval' : '';
    // A phase describes live work; a stopped or finished task keeps its last one only as history.
    if (t.status !== 'running' && t.status !== 'verifying') return '';
    return PHASE[String(t.phase || '').split(':')[0]] || '';
  };
  const costOf = (cost, budget) => cost ? usd(cost) + (budget ? ' of $' + budget : '') : '';
  let projectId = localStorage.getItem('ym-project') || '';
  let board = null;
  let openTask = null;
  let openEntry = null;
  let registry = null;
  let registryError = '';
  let registryReceivedAt = null;
  let boardReceivedAt = null;
  let authFailed = false;
  let streamConnected = false;
  let snapshotError = '';
  function renderConnectionNotice() {
    if (authFailed) return;
    $('load-state').hidden = !snapshotError && streamConnected;
    $('load-message').textContent = snapshotError || (streamConnected ? '' : 'Live updates disconnected. Displayed records may be out of date. Retrying in 2 seconds; check “ym doctor” if this continues.');
  }
  let drawerOrigin = null;
  let detailSequence = 0;
  const drafts = new Map();
  const sectionOpen = new Map();
  const scopeDrafts = new Map();
  const unknown = (value) => value === null || value === undefined || value === '' ? 'Unknown' : String(value);
  const age = (at) => {
    if (at === null || at === undefined || at > Date.now()) return 'age unknown';
    const seconds = Math.max(0, Math.floor((Date.now() - at) / 1000));
    return seconds < 60 ? seconds + 's ago' : seconds < 3600 ? Math.floor(seconds / 60) + 'm ago' : Math.floor(seconds / 3600) + 'h ago';
  };
  function captureFocus(root = document) {
    const node = document.activeElement;
    if (!node || !root.contains(node)) return null;
    return { node, id: node.id, key: node.getAttribute('data-focus'), start: node.selectionStart, end: node.selectionEnd, direction: node.selectionDirection };
  }
  function restoreFocus(saved, root = document) {
    if (!saved) return;
    const node = saved.node.isConnected ? saved.node : saved.id ? $(saved.id) : saved.key ? [...root.querySelectorAll('[data-focus]')].find(n => n.getAttribute('data-focus') === saved.key) : null;
    if (!node || !root.contains(node)) return;
    node.focus({ preventScroll: true });
    if (typeof saved.start === 'number' && node.setSelectionRange) node.setSelectionRange(saved.start, saved.end, saved.direction || 'none');
  }
  function loseAuth() {
    if (authFailed) return;
    authFailed = true;
    localStorage.removeItem('ym-token');
    clearInterval(logTimer);
    if ($('drawer').open) $('drawer').close();
    if ($('add-dialog').open) $('add-dialog').close();
    app.replaceChildren($('tpl-gate').content.cloneNode(true));
    $('auth-message').textContent = 'Access expired or this key is not valid for the owner dashboard. Run “ym dashboard” on your hub and open its new link.';
  }

  async function rpc(method, params = {}) {
    const res = await fetch('/api/rpc/' + method, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify(params) });
    if (res.status === 401) { loseAuth(); throw new Error('Owner access required. Open a fresh “ym dashboard” link.'); }
    if (!res.ok) throw new Error('Hub request failed (HTTP ' + res.status + '). Retry or check “ym doctor”.');
    const body = await res.json();
    if (!body.ok) throw new Error(body.error || 'Request failed');
    return body.result;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
  }

  async function act(id, action, label) {
    try {
      await rpc('task.control', { id, action, by: 'dashboard' });
      toast(label);
      refresh();
      if (openTask === id) showTask(id, true);
    } catch (e) { toast(e.message); }
  }

  // ---------- rendering ----------
  function renderProjects() {
    const sel = $('project');
    const cur = sel.value;
    sel.replaceChildren(el('option', { value: '', text: 'All projects' }), ...board.projects.map((p) => el('option', { value: p.id, text: p.name })));
    sel.value = projectId && board.projects.some((p) => p.id === projectId) ? projectId : cur && board.projects.some((p) => p.id === cur) ? cur : '';
    sel.hidden = board.projects.length < 2 && !projectId;
    $('setup').hidden = board.projects.length > 0;
  }

  function renderSupervision() {
    const p = board.paused;
    $('paused').hidden = !p.paused;
    $('paused-by').textContent = p.paused ? `by ${p.by}.` : '';
    $('pause-btn').hidden = p.paused;
    const ws = board.warnings;
    $('headsup').hidden = !ws.length;
    $('hu-list').replaceChildren(...ws.map((w) => el('li', {}, w.taskId ? el('a', { href: '#', onclick: (e) => { e.preventDefault(); showTask(w.taskId); } }, shortQuoted(w.message)) : shortQuoted(w.message))));
    const burn = $('burn');
    burn.hidden = !board.budgetRunsOutAt;
    if (board.budgetRunsOutAt) burn.textContent = 'At this pace it runs out around ' + new Date(board.budgetRunsOutAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderMeter() {
    $('spent').textContent = usd(board.spentToday);
    const cap = board.dailyBudget;
    $('budget-of').textContent = cap ? `of $${cap}` : '';
    const pct = cap ? Math.min(100, (board.spentToday / cap) * 100) : 0;
    const fill = $('fill');
    fill.style.width = pct + '%';
    fill.className = 'fill' + (pct >= 100 ? ' over' : pct >= 75 ? ' warn' : '');
  }

  function actionButtons(t, compact) {
    const s = t.status;
    const out = [];
    if (s === 'needs_human' || s === 'failed' || s === 'canceled') out.push(el('button', { class: 'btn primary', type: 'button', text: 'Try again', onclick: () => act(t.id, 'retry', 'Queued to try again') }));

      ['Attempt', `${t.attempts} of ${t.max_attempts}`],
      t.scope.length ? ['Files', t.scope.join(', ') + (t.scope_inferred ? ' (guessed from the request)' : '')] : null,
      d.deps.length ? ['After', d.deps.map((x) => `${shortTitle(x.title, 60)} (${LABEL[x.status]})`).join(', ')] : null,
      t.policies && t.policies.length ? ['Rules', t.policies.join(', ')] : null,
      t.race_group ? ['Race', 'Several agents are trying this; the first verified result wins'] : null,
      (() => {
        const reviews = d.runs.filter((r) => r.role === 'review' && r.verdict).map((r) => { try { return `${r.agent}: ${JSON.parse(r.verdict).verdict === 'approve' ? 'approved' : 'asked for changes'}`; } catch { return null; } }).filter(Boolean);
        return reviews.length ? ['Reviews', reviews.join(' · ')] : null;
      })(),
      run && run.lessons && run.lessons.length ? ['Briefed with', `${run.lessons.length} lesson(s) from earlier work`] : null,
      ['Task', t.id],
    ].filter(Boolean);
    renderFacts(facts);
    $('d-acts').replaceChildren(...actionButtons(t, false));
    // Disclosures and the log are rebuilt on every snapshot; keep what the owner opened and where they scrolled.
    const fold = (key, title, openByDefault, ...kids) => {
      const state = id + ':' + key;
      // The key lets focus return to this summary after a snapshot rebuilds the detail under the keyboard.
      const node = el('details', { open: sectionOpen.has(state) ? sectionOpen.get(state) : openByDefault }, el('summary', { 'data-focus': 'fold:' + state }, title), ...kids);
      node.addEventListener('toggle', () => sectionOpen.set(state, node.open));
      return node;
    };
    const oldLog = $('d-log');
    const keptLog = oldLog && oldLog.dataset.task === id ? { text: oldLog.textContent, top: oldLog.scrollTop, atBottom: oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 30 } : null;
    const body = [];
    if (t.attention) body.push(el('div', { class: 'callout amber' }, t.attention));
    else if (t.last_error && t.status !== 'done') body.push(el('div', { class: 'callout red' }, clip(t.last_error, 1500)));
    if (t.summary) body.push(el('div', {}, el('h4', {}, 'What the agent says it did'), el('div', { class: 'callout plain' }, t.summary)));
    if (['queued', 'running', 'verifying', 'needs_human', 'failed'].includes(t.status)) body.push(scopeEditor(t, fold));
    const touched = run && run.touched ? run.touched : [];
    if (touched.length) body.push(fold('files', `Files changed${['done', 'ready', 'merging'].includes(t.status) ? '' : ' so far'} · ${touched.length}`, true,
      el('ul', { class: 'files' }, touched.slice(0, 40).map((file) => el('li', {}, file)), touched.length > 40 ? el('li', {}, `and ${touched.length - 40} more`) : null)));
    if (t.prompt && t.prompt !== shortTitle(t.title)) body.push(fold('request', 'Full request', !t.summary, el('div', { class: 'callout plain' }, clip(t.prompt, 4000))));
    if (!['done', 'canceled', 'failed'].includes(t.status)) {
      const ta = el('textarea', { id: 'd-note', 'data-task': id, maxlength: '4000', placeholder: 'For example: use the existing date helper instead of adding a library' });
      const send = el('button', { class: 'btn', type: 'button', 'data-focus': 'guidance:' + id, text: t.status === 'running' ? 'Redirect now' : 'Add guidance', onclick: async () => {
        const note = ta.value.trim();
        if (!note) { ta.focus(); return; }
        try { await rpc('task.control', { id, action: 'redirect', note, by: 'dashboard' }); toast(t.status === 'running' ? 'Redirect requested. Check the next reported activity.' : 'Guidance saved for the next attempt.'); drafts.delete(id); ta.value = ''; showTask(id, true); } catch (e) { toast(e.message); }
      } });
      body.push(el('div', { class: 'redirect' }, el('label', { for: 'd-note' }, 'Guidance for this task'), ta, el('div', {}, send)));
    }
    const pre = el('pre', { class: 'log', id: 'd-log', 'data-task': id, tabindex: '0', 'aria-label': 'Activity log' }, keptLog ? keptLog.text : 'Loading activity…');
    body.push(el('div', {}, el('h4', {}, 'Activity'), pre));
    const history = (d.events || []).slice(-12).reverse();
    if (history.length) body.push(fold('history', 'History', false, el('ol', { class: 'history' }, history.map((e) => el('li', {}, el('time', { datetime: new Date(e.ts).toISOString() }, clock(e.ts)), el('span', {}, shortQuoted(e.message)))))));
    const technical = [
      t.branch ? ['Branch', t.branch] : null,
      t.head_sha ? ['Artifact SHA', t.head_sha] : null,
      t.base_sha ? ['Started from', t.base_sha] : null,
      t.worktree ? ['Working copy', t.worktree] : null,
    ].filter(Boolean);
    if (technical.length) body.push(fold('technical', 'Technical details', false,
      el('dl', { class: 'facts' }, technical.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),
      t.branch && t.base_sha ? el('p', { class: 'muted' }, 'To read the exact change, run this in your repository:') : null,
      t.branch && t.base_sha ? el('code', { class: 'cmd' }, `git diff ${t.base_sha.slice(0, 12)}...${t.branch}`) : null));
    $('d-body').replaceChildren(...body);
    if (keptLog) pre.scrollTop = keptLog.atBottom ? pre.scrollHeight : keptLog.top;
    const next = $('d-note');
    const draft = drafts.get(id);
    if (next && draft) { next.value = draft.value; next.setSelectionRange(draft.start, draft.end, draft.direction || 'none'); }
    if (!quiet) presentDrawer();
    restoreFocus(savedFocus, drawer);
    const loadLog = async () => {
      if (openTask !== id || logInFlight || authFailed) return;
      logInFlight = true;
      const target = $('d-log');
      try {
        const text = await rpc('task.logs', { id, lines: 300 });
        const node = $('d-log'); if (!node || target !== node || openTask !== id) return;
        const atBottom = node.scrollHeight - node.scrollTop - node.clientHeight < 30;
        node.textContent = tidyPaths(text, t.worktree) || 'No activity yet.';
        if (atBottom) node.scrollTop = node.scrollHeight;
      } catch { if (target?.isConnected) target.textContent = 'Activity unavailable. Close and reopen details to retry.'; }
      finally { logInFlight = false; }
    };
    loadLog();
    clearInterval(logTimer);
    logTimer = setInterval(loadLog, 2000);
  }
  // Allowed files: the owner's answer when work was stopped for touching files outside its list.
  const globToRegExp = (glob) => new RegExp('^' + glob.split('**').map((part) => part.split('*').map((text) => text.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('[^/]*')).join('.*') + '$');
  function scopeEditor(t, fold) {
    const id = t.id;
    const listed = (text) => [...new Set(String(text).split(',').map((part) => part.trim()).filter(Boolean))];
    const rejected = /Changed files outside its declared scope: (.+?)\. Only change /.exec(t.last_error || '');
    const allowed = t.scope.map(globToRegExp);
    const outside = rejected ? listed(rejected[1].replace(/…$/, '')).filter((file) => !allowed.some((pattern) => pattern.test(file))) : [];
    const input = el('input', { id: 'd-scope', type: 'text', 'data-task': id, autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'd-scope-help', value: t.scope.join(', ') });
    if (scopeDrafts.has(id)) input.value = scopeDrafts.get(id);
    const save = el('button', { class: 'btn', type: 'button', 'data-focus': 'scope-save:' + id, text: 'Save allowed files', onclick: async () => {
      try {
        await rpc('task.setScope', { id, scope: listed(input.value), by: 'dashboard' });
        // The saved list is now the baseline, so the rebuild below does not treat it as an unsaved draft.
        scopeDrafts.delete(id); input.setAttribute('value', input.value);
        toast(t.status === 'queued' ? 'Saved for when it starts.' : t.status === 'running' || t.status === 'verifying' ? 'Saved. The current attempt keeps its old list; this applies from the next attempt.' : 'Saved. Choose “Try again” to rerun with this list.');
        showTask(id, true);
      } catch (e) { toast(e.message); }
    } });
    const add = outside.length ? el('button', { class: 'btn', type: 'button', 'data-focus': 'scope-add:' + id, text: outside.length === 1 ? 'Add it to the list' : 'Add them to the list', onclick: () => {
      input.value = listed([input.value, ...outside].join(', ')).join(', ');
      scopeDrafts.set(id, input.value);
      input.focus();
    } }) : null;
    return fold('scope', 'Files it may change', outside.length > 0,
      outside.length ? el('div', { class: 'callout amber' }, `It was stopped for changing ${outside.length === 1 ? 'a file' : outside.length + ' files'} outside this list${rejected && /…$/.test(rejected[1]) ? ' (more were not listed)' : ''}: ${outside.join(', ')}`) : null,
      el('div', { class: 'scope-edit' },
        el('label', { for: 'd-scope' }, 'Files this task may change'),
        input,
        el('small', { id: 'd-scope-help', class: 'muted' }, 'Separate with commas, for example src/settings/**, README.md. Leave empty for no declared list.'),
        el('div', { class: 'registry-actions' }, add, save)));
  }
  function closeDrawer() {
    if ($('drawer').open) $('drawer').close();
    else { openTask = null; openEntry = null; ++detailSequence; clearInterval(logTimer); }
  }
  $('drawer').addEventListener('close', () => {
    saveDraft(); openTask = null; openEntry = null; ++detailSequence; clearInterval(logTimer);
    restoreFocus(drawerOrigin);
    if (!document.activeElement || document.activeElement === document.body) $('open-add')?.focus();
    drawerOrigin = null;
  });
  $('d-close').addEventListener('click', closeDrawer);
  $('refresh-btn').addEventListener('click', () => refresh());
  $('registry-view').addEventListener('change', renderRegistry);
  $('feed-more').addEventListener('click', () => { feedAll = !feedAll; renderFeed(); });

  // Keep keyboard focus on visible controls in the open dialog. Native traversal can send the last Tab to
  // the document body, and a snapshot can remove the focused node; both would let Tab leave the dialog.
  document.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    const dialog = [$('drawer'), $('add-dialog')].find(node => node && node.open);
    if (!dialog) return;
    const controls = [...dialog.querySelectorAll('button, input, select, textarea, summary, a[href], [tabindex]')]
      .filter(node => !node.disabled && node.tabIndex >= 0 && node.getClientRects().length);
    if (!controls.length) { event.preventDefault(); dialog.focus(); return; }
    const first = controls[0], last = controls[controls.length - 1];
    const lost = !dialog.contains(document.activeElement) || document.activeElement === dialog;
    if (event.shiftKey && (document.activeElement === first || lost)) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || lost)) {
      event.preventDefault(); first.focus();
    }
  });

  // ---------- add work ----------
  const dlg = $('add-dialog');
  function openAdd() {
    if (!board || !board.projects.length) return toast('Run “ym init” in a repository first.');
    const after = dlg.querySelector('select[name=after]');
    after.replaceChildren(el('option', { value: '', text: 'Start as soon as possible' }), ...board.active.map((t) => el('option', { value: t.id, text: shortTitle(t.title, 70) })));
    $('add-msg').textContent = '';
    dlg.showModal();
  }
  $('open-add').addEventListener('click', openAdd);
  $('add-cancel').addEventListener('click', () => dlg.close());
  $('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const text = String(f.get('text') || '').trim();
    if (text.length < 3) { $('add-msg').textContent = 'Describe the change in a few words.'; return; }
    const pid = projectId || (board.projects.length === 1 ? board.projects[0].id : '');
    if (!pid) { $('add-msg').textContent = 'Pick a project at the top first.'; return; }
    const files = String(f.get('files') || '').split(',').map((s) => s.trim()).filter(Boolean);
    const task = { title: shortTitle(text.split('\n').find((line) => line.trim()) || text), prompt: text };
    if (files.length) task.files = files;
    if (f.get('tier')) task.tier = f.get('tier');
    if (f.get('after')) task.after = [f.get('after')];
    $('add-submit').disabled = true;
    try {
      const r = await rpc('task.add', { projectId: pid, tasks: [task], createdBy: 'dashboard' });
      if (r.created.length) { toast('Queued: ' + shortTitle(r.created[0].title, 60)); dlg.close(); e.target.reset(); refresh(); }
      else if (r.duplicates.length) $('add-msg').textContent = `This looks the same as “${shortTitle(r.duplicates[0].existingTitle)}”, which is already queued.`;
    } catch (err) { if (!authFailed) $('add-msg').textContent = err.message; }
    finally { if (!authFailed) $('add-submit').disabled = false; }
  });

  // ---------- cleanup ----------
  $('clean-preview').addEventListener('click', async () => {
    try {
      const plan = await rpc('clean.plan', projectId ? { projectId } : {});
      const box = $('clean');
      const parts = [];
      const freed = plan.remove.reduce((n, i) => n + (i.bytes || 0), 0);
      const size = freed >= 1e9 ? (freed / 1e9).toFixed(1) + ' GB' : Math.round(freed / 1e6) + ' MB';
      parts.push(el('p', {}, plan.remove.length ? `${plan.remove.length} item(s) can be removed${freed > 1e6 ? `, freeing about ${size}` : ''}:` : 'Nothing to remove. Everything is tidy.'));
      if (plan.remove.length) parts.push(el('ul', { class: 'clean-list' }, plan.remove.slice(0, 12).map((i) => el('li', {}, `${i.reason}`))));
      if (plan.keep.length) parts.push(el('p', {}, `Kept on purpose (${plan.keep.length}):`), el('ul', { class: 'clean-list keep' }, plan.keep.slice(0, 12).map((i) => el('li', {}, `${clip(i.target.split('/').pop(), 40)}: ${i.reason}`))));
      box.replaceChildren(...parts);
      $('clean-run').hidden = !plan.remove.length;
    } catch (e) { toast(e.message); }
  });
  $('clean-run').addEventListener('click', async () => {
    try {
      const r = await rpc('clean.run', projectId ? { projectId } : {});
      toast(`Removed ${r.removed.length} item(s)` + (r.failed.length ? `, kept ${r.failed.length} that changed` : ''));
      $('clean').replaceChildren(); $('clean-run').hidden = true;
    } catch (e) { toast(e.message); }
  });

  const pauseAsk = $('pause-ask');
  $('pause-btn').addEventListener('click', () => { pauseAsk.hidden = false; $('pause-soft').focus(); });
  $('pause-cancel').addEventListener('click', () => { pauseAsk.hidden = true; $('pause-btn').focus(); });
  const doPause = async (now) => {
    pauseAsk.hidden = true;
    try { await rpc('fleet.pause', { projectId: projectId || null, stopRunning: now, by: 'dashboard' }); toast(now ? 'Paused. Stop requested for coding; checks and reviews can finish.' : 'Paused. Running agents can finish first.'); refresh(); } catch (e) { toast(e.message); }
  };
  $('pause-soft').addEventListener('click', () => doPause(false));
  $('pause-now').addEventListener('click', () => doPause(true));
  $('resume-btn').addEventListener('click', async () => {
    try { await rpc('fleet.resume', { projectId: projectId || null, by: 'dashboard' }); toast('Resumed'); refresh(); } catch (e) { toast(e.message); }
  });

  $('project').addEventListener('change', (e) => {
    closeDrawer(); projectId = e.target.value; localStorage.setItem('ym-project', projectId);
    registry = null; registryError = ''; board = null; feed.length = 0; feedAll = false;
    $('registry').replaceChildren(); $('board').replaceChildren(); $('att-list').replaceChildren(); $('attention').hidden = true; $('machines').replaceChildren(); $('sessions').textContent = ''; renderFeed();
    const scope = projectId;
    refresh(); rpc('events.since', { after: 0, limit: 60, projectId: scope || null }).then(events => { if (scope === projectId) pushEvents(events); }).catch(() => {});
  });

  refresh();
  stream();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
