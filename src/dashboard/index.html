<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yardmaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233DDC84'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='17' text-anchor='middle' fill='%2304210F'%3EY%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0B0D10;
    --pane: #101317;
    --raise: #161A20;
    --raise-2: #1C222A;
    --line: #222831;
    --line-2: #2E3641;
    --ink: #E6EAEE;
    --ink-2: #A3ADB8;
    --ink-3: #7F8995;
    --go: #3DDC84;
    --go-ink: #04210F;
    --go-text: #6BE6A1;
    --need: #FFB020;
    --need-ink: #241700;
    --need-wash: rgba(255, 176, 32, .10);
    --need-line: rgba(255, 176, 32, .35);
    --run: #5AA9FF;
    --run-wash: rgba(90, 169, 255, .10);
    --bad: #FF7A7A;
    --bad-wash: rgba(255, 107, 107, .10);
    --add-wash: rgba(61, 220, 132, .10);
    --add-ink: #B9F5D2;
    --del-wash: rgba(255, 107, 107, .11);
    --del-ink: #FFC9C9;
    --shadow: 0 30px 80px rgba(0, 0, 0, .6);
    --body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r-sm: 6px;
    --r-md: 9px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--ink); font: 13.5px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: var(--r-sm); }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  h1, h2, h3, h4 { margin: 0; }
  h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  h2 small { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
  h4 { font-size: 13px; font-weight: 650; margin-bottom: 6px; }
  a { color: var(--run); }
  p { overflow-wrap: anywhere; }
  code { font-family: var(--mono); font-size: .92em; }
  .muted { color: var(--ink-2); font-size: 12.5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .eyebrow { font: 600 10.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  kbd { font: 600 10.5px/1 var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; }

  .btn { border: 1px solid var(--line-2); background: transparent; color: var(--ink); border-radius: var(--r-sm); padding: 7px 12px; cursor: pointer; font-weight: 560; min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { border-color: var(--ink-3); background: var(--raise); }
  .btn.primary, .btn.go { background: var(--go); border-color: var(--go); color: var(--go-ink); font-weight: 650; }
  .btn.primary:hover, .btn.go:hover { background: #5BE699; border-color: #5BE699; }
  .btn.primary kbd, .btn.go kbd { color: var(--go-ink); border-color: rgba(4, 33, 15, .35); }
  .btn.danger { color: var(--bad); border-color: transparent; }
  .btn.danger:hover { border-color: rgba(255, 122, 122, .4); background: var(--bad-wash); }
  .btn.ghost { border-color: var(--line-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  select { min-height: 34px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 8px; color: var(--ink); max-width: 100%; }

  /* ---- three panes ---- */
  .console { display: grid; grid-template-columns: 236px minmax(380px, 470px) minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .console > * { min-width: 0; min-height: 0; }

  /* ---- left rail ---- */
  .rail { background: var(--pane); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 14px; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; padding: 2px 6px 12px; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--go); display: grid; place-items: center; color: var(--go-ink); font: 700 12px var(--mono); flex: none; }
  .rail label.proj select { width: 100%; font-weight: 560; }
  .rail .eyebrow { padding: 18px 8px 8px; }
  .stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .stage { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); color: var(--ink-2); }
  .stage .stop { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
  .stage-count { font: 600 12px var(--mono); color: var(--ink-3); }
  .stage[data-n="some"] { color: var(--ink); }
  .stage[data-n="some"] .stage-count { color: var(--ink); }
  .stage[data-n="some"][data-s="queued"] .stop { border-color: var(--ink-2); }
  .stage[data-n="some"][data-s="running"] .stop, .stage[data-n="some"][data-s="verifying"] .stop { border-color: var(--run); background: var(--run); }
  .stage[data-n="some"][data-s="ready"] .stop { border-color: var(--need); background: var(--need); }
  .stage[data-n="some"][data-s="ready"] .stage-count { background: var(--need); color: var(--need-ink); border-radius: 9px; padding: 1px 7px; }
  .stage[data-n="some"][data-s="done"] .stop { border-color: var(--go); background: var(--go); }
  .machines { display: grid; gap: 12px; padding: 0 8px; }
  .machine { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
  .machine .n { font-weight: 560; overflow-wrap: anywhere; }
  .machine .a { grid-column: 2 / -1; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .slots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 80px; }
  .slots i { width: 7px; height: 12px; border-radius: 2px; border: 1px solid var(--ink-3); }
  .slots i.used { background: var(--run); border-color: var(--run); }
  .disk { grid-column: 2 / -1; display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-3); }
  .disk .track-bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .disk .fill { height: 100%; background: var(--ink-3); }
  .disk.low { color: var(--bad); }
  .disk.low .fill { background: var(--bad); }
  #sessions { padding: 4px 8px 0; margin: 0; font-size: 11.5px; color: var(--ink-3); }
  .meter { padding: 0 8px; display: grid; gap: 6px; }
  .meter .big { font: 600 20px/1.15 var(--mono); letter-spacing: -.02em; }
  .meter .big span { font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .meter .bar-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--go); width: 0; transition: width .4s; }
  .meter .fill.warn { background: var(--need); }
  .meter .fill.over { background: var(--bad); }
  .meter small { color: var(--need); font-size: 11.5px; }
  .rail-foot { margin-top: auto; padding-top: 16px; display: grid; gap: 10px; }
  .conn { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 7px; padding: 0 6px; }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .conn.live i { background: var(--go); }
  .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
  .lamp.on { background: var(--go); }

  /* ---- middle: the work list ---- */
  .list { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); }
  .list-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .list-head h2 { flex: none; }
  .find { flex: 1; min-width: 0; background: var(--pane); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; font-size: 12.5px; min-height: 34px; }
  .find::placeholder { color: var(--ink-3); }
  .list-body { flex: 1; overflow: auto; }
  .list-body > .notice, .list-body > .banner { margin: 12px 16px 0; }
  .list-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 14px; flex-wrap: wrap; font: 11.5px var(--mono); color: var(--ink-3); }
  .notice { background: var(--need-wash); border: 1px solid var(--need-line); border-radius: var(--r-md); padding: 10px 12px; font-size: 13px; }
  .notice p { margin: 0 0 8px; }
  .notice p:last-child { margin: 0; }
  .banner { border: 1px solid var(--line-2); background: var(--raise); border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 10px; font-size: 13px; }
  .banner b { font-weight: 650; margin-right: 4px; }
  .banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  #paused { border-color: var(--need-line); background: var(--need-wash); }

  .board { padding-bottom: 12px; }
  .group > h3 { font: 600 10.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); padding: 16px 16px 6px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 10px 16px 11px 14px; cursor: pointer; color: var(--ink);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "t time" "status cost" "d d" "track track"; gap: 2px 12px; align-items: baseline; }
  .row:hover { background: var(--pane); }
  .row.sel { background: var(--raise); border-left-color: var(--ink-2); }
  .row.sel[data-s="ready"], .row.sel[data-s="merging"], .row.sel[data-s="needs_human"] { border-left-color: var(--need); }
  .row.sel[data-s="running"], .row.sel[data-s="verifying"] { border-left-color: var(--run); }
  .row:focus-visible { outline-offset: -2px; }
  .row-main { display: contents; }
  .row-main .t { grid-area: t; font-weight: 560; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; letter-spacing: -.005em; }
  .row-main .d { grid-area: d; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .row-main .who { color: var(--ink-2); }
  .row-main .what { color: var(--ink-3); }
  .row[data-s="running"] .row-main .what { font-family: var(--mono); font-size: 11.5px; }
  .row-main .who + .what::before { content: " · "; font-family: var(--body); }
  .row-status { grid-area: status; display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; flex-wrap: wrap; }
  .row-label { font-weight: 600; color: var(--ink-2); }
  .row-sub { color: var(--ink-2); }
  .row-sub::before { content: "· "; color: var(--ink-3); }
  .row[data-s="ready"] .row-label, .row[data-s="merging"] .row-label, .row[data-s="needs_human"] .row-label { color: var(--need); }
  .row[data-s="running"] .row-label, .row[data-s="verifying"] .row-label { color: var(--run); }
  .row[data-s="done"] .row-label { color: var(--go-text); }
  .row[data-s="failed"] .row-label { color: var(--bad); }
  .row-time, .row-cost { font: 11.5px var(--mono); text-align: right; color: var(--ink-3); white-space: nowrap; }
  .row-time { grid-area: time; color: var(--ink-2); }
  .row-cost { grid-area: cost; }
  [data-s="running"] > .row-status .lamp, [data-s="running"] > .lamp { background: var(--run); box-shadow: 0 0 0 3px var(--run-wash); animation: pulse 1.8s ease-in-out infinite; }
  [data-s="verifying"] > .row-status .lamp, [data-s="verifying"] > .lamp { background: var(--run); }
  [data-s="ready"] > .row-status .lamp, [data-s="merging"] > .row-status .lamp, [data-s="ready"] > .lamp, [data-s="merging"] > .lamp { background: var(--need); box-shadow: 0 0 0 3px var(--need-wash); }
  [data-s="done"] > .row-status .lamp, [data-s="done"] > .lamp { background: var(--go); }
  [data-s="needs_human"] > .row-status .lamp, [data-s="needs_human"] > .lamp, [data-s="failed"] > .row-status .lamp, [data-s="failed"] > .lamp { background: var(--bad); }
  [data-s="queued"] > .row-status .lamp { background: transparent; border: 1.5px solid var(--ink-3); }
  @keyframes pulse { 50% { opacity: .4; } }
  .track { grid-area: track; display: flex; gap: 3px; margin-top: 6px; }
  .track i { height: 3px; flex: 1; border-radius: 2px; background: var(--line-2); }
  .track i.past { background: var(--ink-3); }
  .track i.now { background: var(--run); }
  .track[data-s="queued"] { display: none; }
  .track[data-s="ready"] i.now, .track[data-s="merging"] i.now { background: var(--need); }
  .track[data-s="done"] { display: none; }
  .board-empty { padding: 40px 24px; display: grid; gap: 8px; justify-items: start; }
  .board-empty strong { font-size: 16px; }
  .board-empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }
  .board-empty .btn { margin-top: 8px; }
  .board-note { margin: 0; padding: 16px; color: var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none !important; } .meter .fill { transition: none; } }

  /* ---- right: overview or the selected task ---- */
  .right { position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .overview { overflow: auto; padding: 26px 28px 40px; display: grid; gap: 22px; align-content: start; }
  .headline { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -.02em; }
  .headline-sub { margin: 6px 0 0; color: var(--ink-2); }
  .card { border: 1px solid var(--line); background: var(--pane); border-radius: var(--r-md); padding: 14px 16px; }
  #attention { border-color: var(--need-line); background: linear-gradient(var(--need-wash), var(--need-wash)), var(--pane); padding: 14px 16px 4px; }
  #attention h2 { color: var(--need); }
  #attention h2 small { color: var(--need); opacity: .8; }
  .need { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 12px 0; border-top: 1px solid var(--need-line); }
  .need:first-of-type { border-top: 0; }
  .need .t { font-weight: 600; overflow-wrap: anywhere; }
  .need .why { color: var(--ink-2); font-size: 13px; max-width: 78ch; overflow-wrap: anywhere; }
  .need .acts { display: flex; gap: 8px; align-items: start; flex-wrap: wrap; justify-content: end; grid-row: span 2; }
  #headsup { border-color: rgba(90, 169, 255, .35); }
  #headsup h2 { color: var(--run); margin-bottom: 6px; }
  #headsup ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  #headsup a { color: inherit; text-decoration: none; }
  #headsup a:hover { text-decoration: underline; }
  .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .two > * { min-width: 0; }
  .section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .feed { list-style: none; margin: 10px 0 0; padding: 0; }
  #feed-more { margin-top: 10px; }
  .feed li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .feed li:first-child { border-top: 0; }
  .feed time, .history time { color: var(--ink-3); font: 11.5px var(--mono); white-space: nowrap; padding-top: 2px; min-width: 44px; }
  .feed span { overflow-wrap: anywhere; color: var(--ink-2); }
  .feed li[data-l="warn"] span { color: var(--need); }
  .feed li[data-l="error"] span { color: var(--bad); }
  .feed li[data-l="success"] span { color: var(--go-text); }
  .feed a { color: inherit; text-decoration: none; }
  .feed a:hover { text-decoration: underline; }
  .clean-list { font-size: 12.5px; margin: 8px 0 12px; padding-left: 18px; color: var(--ink-2); }
  .clean-list li { margin: 3px 0; overflow-wrap: anywhere; }
  .clean-list.keep li::marker { color: var(--need); }
  .connections { padding: 0; }
  .connections > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
  .connections > summary::-webkit-details-marker { display: none; }
  .connections > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); align-self: center; margin-right: 2px; flex: none; }
  .connections[open] > summary::before { transform: rotate(45deg); }
  .connections-body { padding: 0 16px 14px; display: grid; gap: 12px; }
  .connections-body > * { margin: 0; }
  .registry-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .registry-row { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; display: grid; align-content: start; gap: 5px; overflow-wrap: anywhere; font-size: 13px; }
  .registry-top { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .registry-state { flex-shrink: 0; font: 11px var(--mono); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 8px; }
  .registry-row[data-state="stale"] { border-left: 3px solid var(--need); }
  .registry-row[data-state="stale"] .registry-state { color: var(--need); border-color: var(--need-line); }
  .registry-row p { margin: 0; }
  .registry-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .privacy { margin: 0; color: var(--ink-3); font-size: 11.5px; }

  /* ---- the selected task (inline on wide screens, full screen on narrow ones) ---- */
  dialog { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 0; width: min(620px, calc(100vw - 32px)); background: var(--pane); color: var(--ink); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog.drawer { margin: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; background: var(--bg); width: 100%; max-width: 100%; }
  dialog.drawer[open] { display: flex; flex-direction: column; }
  dialog.drawer { position: static; inset: auto; height: 100%; max-height: 100%; flex: 1; min-height: 0; }
  .drawer .head { padding: 16px 24px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; position: relative; }
  .drawer .close { position: absolute; top: 10px; right: 12px; border: 1px solid transparent; background: none; color: var(--ink-2); font-size: 20px; cursor: pointer; line-height: 1; border-radius: var(--r-sm); min-height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .drawer .close:hover { border-color: var(--line-2); color: var(--ink); }
  .drawer .close kbd { font-size: 10px; }
  .crumb { font: 11.5px var(--mono); color: var(--ink-3); padding-right: 60px; overflow-wrap: anywhere; }
  .drawer .head h2 { overflow-wrap: anywhere; font-size: 20px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; padding-right: 48px; }
  .d-status { display: flex; align-items: center; gap: 8px; font-weight: 650; flex-wrap: wrap; font-size: 12.5px; }
  .d-status[data-s] { width: fit-content; border-radius: 999px; padding: 4px 10px 4px 9px; background: var(--raise-2); }
  .d-status[data-s="ready"], .d-status[data-s="merging"] { background: var(--need); color: var(--need-ink); }
  .d-status[data-s="ready"] .lamp, .d-status[data-s="merging"] .lamp { background: var(--need-ink); }
  .d-status[data-s="needs_human"], .d-status[data-s="failed"] { background: var(--bad-wash); color: var(--bad); }
  .d-status[data-s="running"], .d-status[data-s="verifying"] { background: var(--run-wash); color: var(--run); }
  .d-status[data-s="done"] { background: var(--add-wash); color: var(--go-text); }
  .d-status .row-sub { font-weight: 500; color: inherit; opacity: .85; }
  .d-status .row-sub::before { content: "· "; }
  .d-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
  .d-track li { border-top: 3px solid var(--line-2); padding-top: 5px; font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
  .d-track li.past { border-top-color: var(--ink-3); color: var(--ink-2); }
  .d-track li.now { border-top-color: var(--run); color: var(--ink); font-weight: 650; }
  .d-track[data-s="queued"] li.now { border-top-color: var(--ink-2); }
  .d-track[data-s="ready"] li.now, .d-track[data-s="merging"] li.now { border-top-color: var(--need); }
  .d-track[data-s="done"] li.now { border-top-color: var(--go); }
  .facts { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 1fr); gap: 3px 14px; font-size: 12.5px; margin: 0; }
  .head .facts { grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 3px 14px; }
  .facts dt { color: var(--ink-3); overflow-wrap: anywhere; }
  .facts dd { margin: 0; overflow-wrap: anywhere; color: var(--ink-2); }
  .drawer .acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .drawer .acts:empty { display: none; }
  .drawer .acts .btn.danger { margin-left: auto; }
  /* A flex column, not a grid: a grid with less room than content collapses scrolling children to nothing. */
  .drawer .body { flex: 1; min-height: 0; overflow: auto; padding: 0 24px 30px; display: flex; flex-direction: column; gap: 16px; }
  .drawer .body > * { flex: none; min-width: 0; }
  .drawer .body > .callout:first-child, .drawer .body > .tabs:first-child { margin-top: 0; }
  .drawer .body > .callout { margin-top: 16px; }
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 0 -24px; padding: 0 24px; position: sticky; top: 0; background: var(--bg); z-index: 1; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 0 9px; color: var(--ink-2); font-weight: 560; cursor: pointer; white-space: nowrap; border-radius: 0; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab span { font: 11px var(--mono); color: var(--ink-3); margin-left: 5px; }
  .panel { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .panel > details > summary { cursor: pointer; font-weight: 650; font-size: 13px; }
  .panel > details > *:not(summary) { margin-top: 8px; }
  .callout { border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .callout.amber { background: var(--need-wash); border-left: 3px solid var(--need); color: #FFE2A8; }
  .callout.red { background: var(--bad-wash); border-left: 3px solid var(--bad); color: var(--del-ink); }
  .callout.plain { background: var(--pane); border: 1px solid var(--line); color: var(--ink-2); }
  .files { margin: 0; padding-left: 18px; font: 12px/1.6 var(--mono); overflow-wrap: anywhere; color: var(--ink-2); }
  .history { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .history li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .history li:first-child { border-top: 0; }
  .history span { overflow-wrap: anywhere; color: var(--ink-2); }
  .redirect, .scope-edit { display: grid; gap: 6px; }
  .redirect label, .scope-edit label { font-weight: 650; font-size: 13px; }
  .scope-edit input, .redirect textarea { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px; background: var(--pane); color: var(--ink); min-height: 34px; }
  .scope-edit input { font-family: var(--mono); font-size: 12.5px; }
  .redirect textarea { min-height: 60px; resize: vertical; }
  pre.log { margin: 0; background: var(--pane); border: 1px solid var(--line); color: var(--ink-2); border-radius: var(--r-sm); padding: 12px 14px; font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; }
  code.cmd { display: block; font: 12px/1.5 var(--mono); background: var(--pane); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; user-select: all; color: var(--ink-2); }

  /* ---- the change itself ---- */
  .change { display: grid; grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--pane); }
  .change-files { border-right: 1px solid var(--line); padding: 8px 0; font: 12px var(--mono); max-height: 64vh; overflow: auto; }
  .change-sum { padding: 2px 12px 8px; color: var(--ink-3); }
  .change-file { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 5px 12px; background: none; border: 0; color: var(--ink-2); text-align: left; cursor: pointer; font: inherit; border-radius: 0; }
  .change-file:hover, .change-file.on { background: var(--raise); color: var(--ink); }
  .change-file .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .change-file .pm { flex: none; }
  .plus { color: var(--go-text); }
  .minus { color: var(--bad); }
  .patch { margin: 0; font: 12px/1.6 var(--mono); max-height: 64vh; overflow: auto; padding: 8px 0; min-width: 0; }
  .patch div { padding: 0 14px; white-space: pre; color: var(--ink-2); min-height: 1.6em; }
  .patch .fh { color: var(--ink); background: var(--raise); padding-top: 4px; padding-bottom: 4px; margin-top: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .patch .fh:first-child { margin-top: -8px; border-top: 0; }
  .patch .hk { color: var(--ink-3); }
  .patch .ad { background: var(--add-wash); color: var(--add-ink); }
  .patch .dl { background: var(--del-wash); color: var(--del-ink); }
  .patch .mt { color: var(--ink-3); }
  .change-note { color: var(--ink-2); font-size: 13px; margin: 0; }

  /* ---- add work ---- */
  form.add { display: grid; gap: 16px; padding: 22px 24px; }
  form.add h2 { margin: 0; font-size: 18px; }
  form.add label { display: grid; gap: 6px; font-weight: 600; }
  form.add label small { font-weight: 400; color: var(--ink-2); }
  form.add textarea, form.add input[type=text], form.add select { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 11px; background: var(--bg); color: var(--ink); font-weight: 400; }
  form.add textarea { min-height: 120px; resize: vertical; }
  .choice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 0; padding: 0; margin: 0; }
  .choice legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .choice label { border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px; font-weight: 500; cursor: pointer; display: grid; gap: 2px; background: var(--bg); }
  .choice label small { font-size: 11.5px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label:has(input:checked) { border-color: var(--go); box-shadow: inset 0 0 0 1px var(--go); }
  .choice label:has(input:focus-visible) { outline: 2px solid var(--run); outline-offset: 2px; }
  .form-acts { display: flex; justify-content: end; gap: 10px; flex-wrap: wrap; }
  .form-msg { font-size: 13px; min-height: 1.5em; color: var(--need); }

  .gate { max-width: 560px; width: calc(100% - 32px); margin: 12vh auto; background: var(--pane); border: 1px solid var(--line); border-radius: var(--r-md); padding: 28px 30px; overflow-wrap: anywhere; }
  .gate h1 { margin: 0 0 8px; font-size: 20px; }
  .gate code { background: var(--raise); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--raise-2); color: var(--ink); border: 1px solid var(--line-2); padding: 9px 16px; border-radius: var(--r-sm); font-size: 13px; z-index: 30; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }

  @media (max-width: 1360px) {
    .head .facts { grid-template-columns: max-content minmax(0, 1fr); }
    .two { grid-template-columns: minmax(0, 1fr); }
    .change { grid-template-columns: minmax(0, 1fr); }
    .change-files { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
  }
  @media (max-width: 1099px) {
    /* One column: what needs the owner first, then the list, then the hub's history and housekeeping. */
    .console { display: flex; flex-direction: column; height: auto; }
    .right, .overview { display: contents; }
    #summary, #attention, #headsup { order: 1; margin: 16px 16px 0; }
    .list { order: 2; margin-top: 8px; border-top: 1px solid var(--line); }
    .two, #conn-details, .privacy { order: 3; margin: 0 16px 16px; }
    .two { margin-top: 16px; }
    .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .brand { padding: 0; }
    .rail label.proj { flex: 1; min-width: 140px; max-width: 260px; }
    .rail .eyebrow, .rail .stages, .rail .machines, #sessions, #disk-h { display: none; }
    .meter { padding: 0; flex: 1; min-width: 150px; }
    .meter .big { font-size: 15px; }
    .rail-foot { margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
    .list { border-right: 0; }
    .list-body { overflow: visible; }
    .list-foot { display: none; }
    .drawer .head, .drawer .acts { padding-left: 16px; padding-right: 16px; }
    .drawer .body { padding: 0 16px 30px; }
    .tabs { margin: 0 -16px; padding: 0 16px; }
    .choice { grid-template-columns: 1fr 1fr; }
    /* No room beside the list: the open task covers the screen, and the page behind it is made inert. */
    dialog.drawer[open] { position: fixed; inset: 0; z-index: 20; height: 100vh; height: 100dvh; max-height: none; }
  }
  @media (max-width: 560px) {
    .rail-foot { width: 100%; }
    .rail-foot .btn { flex: 1; }
    .conn { display: none; }
    .need { grid-template-columns: minmax(0, 1fr); }
    .need .acts { grid-row: auto; justify-content: start; order: 3; }
    .facts { grid-template-columns: minmax(0, 90px) minmax(0, 1fr); }
  }
</style>
</head>
<body>
<noscript><p class="gate">This local control dashboard needs JavaScript. Enable it here or use <code>ym status</code> in a terminal.</p></noscript>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<template id="tpl-gate">
  <div class="gate">
    <h1>Open this page from Yardmaster</h1>
    <p id="auth-message">This dashboard needs the access key for your hub. Run this in a terminal and use the link it prints:</p>
    <p><code>ym dashboard</code></p>
    <p class="muted">The key stays in this browser only and is never sent anywhere except your own hub.</p>
  </div>
</template>

<template id="tpl-main">
  <div class="console">
    <aside class="rail" aria-label="Hub">
      <h1 class="brand"><span class="mark" aria-hidden="true">Y</span>Yardmaster</h1>
      <label class="proj"><span class="sr">Project</span><select id="project"></select></label>
      <h2 class="eyebrow">The line</h2>
      <ol class="stages" id="stages" aria-label="Tasks at each stage"></ol>
      <h2 class="eyebrow" id="mach-h">Machines</h2>
      <div class="machines" id="machines"></div>
      <p id="sessions"></p>
      <h2 class="eyebrow" id="disk-h">Spent today</h2>
      <div class="meter" id="meter" aria-live="polite">
        <div class="big"><b class="num" id="spent">$0</b> <span id="budget-of"></span></div>
        <div class="bar-track"><div class="fill" id="fill"></div></div>
        <small id="burn" hidden></small>
      </div>
      <div class="rail-foot">
        <button class="btn ghost" id="pause-btn" type="button">Pause new work</button>
        <div class="conn" id="conn" role="status"><i></i><span>Connecting</span></div>
      </div>
    </aside>

    <section class="list" aria-labelledby="board-h">
      <div class="list-head">
        <h2 id="board-h">Work</h2>
        <label class="sr" for="find">Filter work</label>
        <input class="find" id="find" type="search" placeholder="Filter work" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="open-add" type="button">Add work <kbd>N</kbd></button>
      </div>
      <div class="list-body" id="main">
        <section id="load-state" class="notice" role="status">
          <p id="load-message">Connecting to your personal hub…</p>
          <button class="btn" id="refresh-btn" type="button">Refresh now</button>
        </section>
        <section id="setup" class="notice" hidden aria-label="Set up a project">
          <p>Start with a repository. Run <code>ym init</code> there, then <code>ym connect all</code> to connect supported coding clients. Return here and refresh.</p>
        </section>
        <section id="pause-ask" hidden aria-labelledby="pa-h" class="banner">
          <div><b id="pa-h">Pause new work?</b> Coding agents can finish, or stop now and keep their work for later. Checks and reviews already running can finish.</div>
          <div class="acts">
            <button class="btn primary" id="pause-soft" type="button">Pause, let them finish</button>
            <button class="btn" id="pause-now" type="button">Pause and stop coding</button>
            <button class="btn" id="pause-cancel" type="button">Keep going</button>
          </div>
        </section>
        <section id="paused" class="banner" hidden role="status">
          <div><b>Paused</b> <span id="paused-by"></span> No new work starts until you resume.</div>
          <div class="acts"><button class="btn go" id="resume-btn" type="button">Resume</button></div>
        </section>
        <div class="board" id="board"></div>
      </div>
      <div class="list-foot" aria-hidden="true"><span><kbd>J</kbd> <kbd>K</kbd> move</span><span><kbd>A</kbd> approve</span><span><kbd>R</kbd> guidance</span><span><kbd>N</kbd> add work</span><span><kbd>/</kbd> filter</span></div>
    </section>

    <div class="right">
      <div class="overview" id="overview">
        <section id="summary" aria-label="Status">
          <p class="eyebrow" id="summary-sub"></p>
          <p class="headline" id="summary-line" role="status">Loading your work…</p>
        </section>
        <section id="attention" class="card" hidden aria-labelledby="att-h">
          <h2 id="att-h">Needs you <small id="att-count"></small></h2>
          <div id="att-list"></div>
        </section>
        <section id="headsup" class="card" hidden aria-labelledby="hu-h">
          <h2 id="hu-h">Heads up</h2>
          <ul id="hu-list"></ul>
        </section>
        <div class="two">
          <section class="card" aria-labelledby="feed-h">
            <h2 id="feed-h">What just happened</h2>
            <ol class="feed" id="feed" aria-live="polite"></ol>
            <button class="btn" id="feed-more" type="button" hidden></button>
          </section>
          <section class="card" aria-labelledby="clean-h">
            <h2 id="clean-h">Cleanup</h2>
            <p class="muted">Finished worktrees, merged branches and expired reservations are removed. Review the plan first. Changed or unmerged work is kept when the hub cannot confirm it is safe to remove.</p>
            <div id="clean"></div>
            <div class="registry-actions"><button class="btn" id="clean-preview" type="button">Check what can be removed</button><button class="btn go" id="clean-run" type="button" hidden>Clean up now</button></div>
          </section>
        </div>
        <details class="card connections" id="conn-details">
          <summary><h2 id="agents-h">Agents and connections</h2><span class="muted" id="conn-summary"></span></summary>
          <div class="connections-body">
            <div class="section-head">
              <p id="registry-status" class="muted" role="status">Loading connected agents…</p>
              <label><span class="sr">Registry view</span><select id="registry-view"><option value="current">Current connections</option><option value="all">Include recent runs</option></select></label>
            </div>
            <div id="registry" class="registry-list"></div>
            <details id="registry-coverage"><summary>What this view can see</summary>
              <p class="muted">Managed: Yardmaster run records. Observed: connected native sessions. Stale: connection or ownership evidence is out of date. Unconnected: a machine reports an installed client, without a connected session. A heartbeat does not prove a process is alive.</p>
              <p class="muted" id="coverage"></p>
            </details>
          </div>
        </details>
        <p class="privacy">Personal hub · Data and logs come from this hub only. No cloud telemetry. Remote access needs your own private HTTPS or encrypted network; this page does not configure it.</p>
      </div>

      <dialog class="drawer" id="drawer" aria-labelledby="d-title">
        <div class="head">
          <button class="close" id="d-close" type="button" aria-label="Close details"><kbd aria-hidden="true">Esc</kbd>×</button>
          <div class="crumb" id="d-crumb"></div>
          <h2 id="d-title"></h2>
          <div class="d-status" id="d-status"></div>
          <ol class="d-track" id="d-track" hidden></ol>
          <dl class="facts" id="d-facts"></dl>
        </div>
        <div class="acts" id="d-acts"></div>
        <div class="body" id="d-body"></div>
      </dialog>
    </div>
  </div>

  <dialog id="add-dialog" aria-labelledby="add-h">
    <form class="add" id="add-form" method="dialog">
      <h2 id="add-h">Add work</h2>
      <label>What should be done?
        <small>Write it like you would to a colleague. The first sentence becomes the task's name.</small>
        <textarea name="text" required placeholder="Add a dark mode toggle to the settings page and remember the choice"></textarea>
      </label>
      <label>Files it will change <small>Optional. Separate with commas, for example src/settings/**, README.md</small>
        <input type="text" name="files" autocomplete="off">
      </label>
      <fieldset class="choice">
        <legend>Speed and cost</legend>
        <label><input type="radio" name="tier" value="" checked>Let it decide<small>Picks a model size from the request</small></label>
        <label><input type="radio" name="tier" value="cheap">Cheapest<small>Small fixes, docs</small></label>
        <label><input type="radio" name="tier" value="standard">Balanced<small>Most features</small></label>
        <label><input type="radio" name="tier" value="strong">Best quality<small>Tricky or risky work</small></label>
      </fieldset>
      <label>Do this after <small>Optional. Waits until the chosen task is merged.</small>
        <select name="after"><option value="">Start as soon as possible</option></select>
      </label>
      <div class="form-msg" id="add-msg" role="status"></div>
      <div class="form-acts">
        <button class="btn" type="button" id="add-cancel">Cancel</button>
        <button class="btn primary" type="submit" id="add-submit">Queue work</button>
      </div>
    </form>
  </dialog>
</template>

<script>
(() => {
  const STAGES = [
    { s: 'queued', name: 'Waiting', match: ['queued'] },
    { s: 'running', name: 'Working', match: ['running'] },
    { s: 'verifying', name: 'Checking', match: ['verifying'] },
    { s: 'ready', name: 'Ready to merge', match: ['ready', 'merging'] },
    { s: 'done', name: 'Done', match: ['done'] },
  ];
  const stageIndex = (status) => STAGES.findIndex((st) => st.match.includes(status));
  // What the latest run is doing inside a stage, in plain words. Unknown phases show nothing.
  const PHASE = { prepare: 'Setting up', setup: 'Installing dependencies', route: 'Choosing a model', agent: 'Coding', collect: 'Saving its work', verify: 'Running checks', review_wait: 'In review', review: 'In review' };
  const LABEL = { queued: 'Waiting', running: 'Working', verifying: 'Checking', ready: 'Ready to merge', merging: 'Merging', done: 'Done', needs_human: 'Needs you', failed: 'Failed', canceled: 'Canceled' };

  // The key arrives in the URL fragment (never sent to servers or logs), then lives in localStorage.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('token');
  if (fromHash) { localStorage.setItem('ym-token', fromHash); history.replaceState(null, '', location.pathname); }
  const token = localStorage.getItem('ym-token');
  const app = document.getElementById('app');
  if (!token) { app.append(document.getElementById('tpl-gate').content.cloneNode(true)); return; }
  app.append(document.getElementById('tpl-main').content.cloneNode(true));

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const usd = (n) => !n ? '$0' : n < 0.01 ? '<$0.01' : '$' + n.toFixed(2);
  const clip = (s, n) => !s ? '' : s.length > n ? s.slice(0, n - 1) + '…' : s;
  const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  // Requests are written as paragraphs; a row needs the gist. Mirrors taskTitle() in src/text.ts for
  // titles stored by older hubs and CLIs, which kept up to 200 characters of the request.
  const shortTitle = (s, max = 96) => {
    const line = String(s || '').replace(/\s+/g, ' ').trim();
    for (const stop of line.matchAll(/[.!?](?=\s+[A-Z0-9"'`(\[])/g)) {
      if (line.slice(0, stop.index).includes(' ')) return clip(line.slice(0, stop.index), max);
    }
    return clip(line, max);
  };
  const shortQuoted = (message) => String(message || '').replace(/"([^"]{97,})"/g, (_, title) => '"' + shortTitle(title) + '"');
  const elapsed = (from) => {
    if (!from || from > Date.now()) return '';
    const m = Math.floor((Date.now() - from) / 60000);
    return m < 1 ? 'under 1m' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  };
  // Agent activity arrives as "<kind> <text>" with absolute worktree paths and environment prefixes.
  const tidyPaths = (text, worktree) => {
    // Only the step into the task's own working copy is noise; "cd packages/web && npm test" says where it ran.
    // A quoted path may hold spaces; an unquoted one cannot. Either must end at the task's own folder.
    const step = (quoted, bare) => new RegExp('cd (?:"' + quoted('"') + '/?"|\'' + quoted('\'') + '/?\'|' + bare + '/?)[ \\t]*(?:;|&&)[ \\t]*', 'g');
    const entered = String(text || '').replace(step((quote) => '/[^' + quote + '\\n]*/t-[0-9a-f]{8,}', '/[^\\s"\']*/t-[0-9a-f]{8,}'), '');
    const exact = worktree ? worktree.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '';
    const plain = (worktree ? entered.replace(step(() => exact, exact), '') : entered)
      .replace(/(?:export )?PATH="[^"\n]*(?:"|…)[ \t]*;?[ \t]*/g, '');
    const local = worktree ? plain.split(worktree + '/').join('').split(worktree).join('its working copy') : plain;
    return local.replace(/\/[^\s"']*\/t-[0-9a-f]{8,}(\/?)/g, (_, slash) => slash ? '' : 'its working copy');
  };
  const tidyActivity = (line) => {
    const text = tidyPaths(line).trim();
    const [kind, ...rest] = text.split(' ');
    const body = rest.join(' ');
    if (kind === 'says') return body;
    if (kind === 'tool') return /^Bash\s*…?$/.test(body) ? 'Running a command' : body.replace(/^Bash /, 'Running: ');
    if (kind === 'edit') return 'Editing ' + body.replace(/^(?:Write|Edit|MultiEdit) /, '');
    if (kind === 'start') return 'Started ' + body.replace(/ in\s*$/, '');
    return text;
  };
  const phaseOf = (t) => {

    const rejected = /Changed files outside its declared scope: (.+?)\. Only change /.exec(t.last_error || '');
    const allowed = t.scope.map(globToRegExp);
    const outside = rejected ? listed(rejected[1].replace(/…$/, '')).filter((file) => !allowed.some((pattern) => pattern.test(file))) : [];
    const input = el('input', { id: 'd-scope', type: 'text', 'data-task': id, autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'd-scope-help', value: t.scope.join(', ') });
    if (scopeDrafts.has(id)) input.value = scopeDrafts.get(id);
    const save = el('button', { class: 'btn', type: 'button', 'data-focus': 'scope-save:' + id, text: 'Save allowed files', onclick: async () => {
      try {
        await rpc('task.setScope', { id, scope: listed(input.value), by: 'dashboard' });
        // The saved list is now the baseline, so the rebuild below does not treat it as an unsaved draft.
        scopeDrafts.delete(id); input.setAttribute('value', input.value);
        toast(t.status === 'queued' ? 'Saved for when it starts.' : t.status === 'running' || t.status === 'verifying' ? 'Saved. The current attempt keeps its old list; this applies from the next attempt.' : 'Saved. Choose “Try again” to rerun with this list.');
        showTask(id, true);
      } catch (e) { toast(e.message); }
    } });
    const add = outside.length ? el('button', { class: 'btn', type: 'button', 'data-focus': 'scope-add:' + id, text: outside.length === 1 ? 'Add it to the list' : 'Add them to the list', onclick: () => {
      input.value = listed([input.value, ...outside].join(', ')).join(', ');
      scopeDrafts.set(id, input.value);
      input.focus();
    } }) : null;
    return fold('scope', 'Files it may change', outside.length > 0,
      outside.length ? el('div', { class: 'callout amber' }, `It was stopped for changing ${outside.length === 1 ? 'a file' : outside.length + ' files'} outside this list${rejected && /…$/.test(rejected[1]) ? ' (more were not listed)' : ''}: ${outside.join(', ')}`) : null,
      el('div', { class: 'scope-edit' },
        el('label', { for: 'd-scope' }, 'Files this task may change'),
        input,
        el('small', { id: 'd-scope-help', class: 'muted' }, 'Separate with commas, for example src/settings/**, README.md. Leave empty for no declared list.'),
        el('div', { class: 'registry-actions' }, add, save)));
  }
  function closeDrawer() {
    if ($('drawer').open) $('drawer').close();
    else { openTask = null; openEntry = null; ++detailSequence; clearInterval(logTimer); }
  }
  $('drawer').addEventListener('close', () => {
    // A close only ever comes from dismissal; the page may already have been replaced by the access gate.
    if (authFailed) { openTask = null; openEntry = null; ++detailSequence; drawerOrigin = null; return; }
    saveDraft(); openTask = null; openEntry = null; ++detailSequence; clearInterval(logTimer);
    applyPresentation(); markSelected();
    restoreFocus(drawerOrigin);
    if (!document.activeElement || document.activeElement === document.body) $('open-add')?.focus();
    drawerOrigin = null;
  });
  $('d-close').addEventListener('click', closeDrawer);
  $('refresh-btn').addEventListener('click', () => refresh());
  $('registry-view').addEventListener('change', renderRegistry);
  $('feed-more').addEventListener('click', () => { feedAll = !feedAll; renderFeed(); });

  // Keep keyboard focus on visible controls in the open dialog. Native traversal can send the last Tab to
  // the document body, and a snapshot can remove the focused node; both would let Tab leave the dialog.
  document.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    // The add-work dialog sits above everything, so it owns Tab whenever it is open.
    const dialog = [$('add-dialog'), fullScreen() ? $('drawer') : null].find(node => node && node.open);
    if (!dialog) return;
    const controls = [...dialog.querySelectorAll('button, input, select, textarea, summary, a[href], [tabindex]')]
      .filter(node => !node.disabled && node.tabIndex >= 0 && node.getClientRects().length);
    if (!controls.length) { event.preventDefault(); dialog.focus(); return; }
    const first = controls[0], last = controls[controls.length - 1];
    const lost = !dialog.contains(document.activeElement) || document.activeElement === dialog;
    if (event.shiftKey && (document.activeElement === first || lost)) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || lost)) {
      event.preventDefault(); first.focus();
    }
  });

  // Single-key shortcuts for the list and the open task. Typing in a field, a modifier, or an open
  // modal dialog leaves keys alone.
  let approveArmed = null;
  document.addEventListener('keydown', event => {
    // A key that is part of an input method composition (Escape cancels the candidate text) is not a shortcut.
    if (event.defaultPrevented || event.isComposing || event.keyCode === 229 || event.metaKey || event.ctrlKey || event.altKey || authFailed) return;
    const target = event.target || document.activeElement;
    const typing = target && (['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) || target.isContentEditable);
    if (event.key === 'Escape' && target?.id === 'find' && $('find').value) { $('find').value = ''; renderBoard(); return; }
    if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && target?.getAttribute?.('role') === 'tab' && openTask) {
      const keys = ['changes', 'activity', 'request', 'history', 'details'];
      const at = keys.indexOf(target.id.replace('tab-', ''));
      const next = keys[(Math.max(0, at) + (event.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
      event.preventDefault(); selectTab(openTask, next); $('tab-' + next)?.focus(); return;
    }
    // Escape closes the open task in either presentation, including while typing in it.
    if (event.key === 'Escape' && $('drawer').open && !$('add-dialog').open) { event.preventDefault(); closeDrawer(); return; }
    if (typing || $('add-dialog').open || fullScreen()) return;
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (key === 'j' || key === 'k' || key === 'ArrowDown' || key === 'ArrowUp') {
      const rows = rowsInOrder();
      if (!rows.length) return;
      event.preventDefault();
      const at = rows.findIndex((node) => node.getAttribute('data-focus') === 'task:' + openTask);
      const down = key === 'j' || key === 'ArrowDown';
      const next = rows[at < 0 ? (down ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, at + (down ? 1 : -1)))];
      next.focus(); next.scrollIntoView?.({ block: 'nearest' });
      showTask(next.getAttribute('data-focus').slice(5));
    } else if (key === 'Escape' && $('drawer').open) {
      event.preventDefault(); closeDrawer();
    } else if (key === 'n') {
      event.preventDefault(); openAdd();
    } else if (key === '/') {
      event.preventDefault(); $('find').focus();
    } else if (key === 'r' && openTask) {
      const note = $('d-note');
      if (!note) return;
      event.preventDefault(); selectTab(openTask, 'activity'); $('d-note').focus();
    } else if (key === 'a' && openTask) {
      // A held key repeats; only a fresh press counts, so holding A can never merge.
      if (event.repeat) { event.preventDefault(); return; }
      const approve = [...$('d-acts').querySelectorAll('[data-focus]')].find((node) => node.textContent === 'Approve and merge');
      if (!approve) return;
      event.preventDefault();
      // Approval merges the change: one key press shows the button, the second (or Enter) confirms.
      if (approveArmed === openTask) { approveArmed = null; approve.click(); return; }
      approveArmed = openTask; approve.focus(); toast('Press A again, or Enter, to approve and merge.');
      setTimeout(() => { approveArmed = null; }, 4000);
    }
  });
  $('find').addEventListener('input', () => { if (board) renderBoard(); });

  // ---------- add work ----------
  const dlg = $('add-dialog');
  function openAdd() {
    if (!board || !board.projects.length) return toast('Run “ym init” in a repository first.');
    const after = dlg.querySelector('select[name=after]');
    after.replaceChildren(el('option', { value: '', text: 'Start as soon as possible' }), ...board.active.map((t) => el('option', { value: t.id, text: shortTitle(t.title, 70) })));
    $('add-msg').textContent = '';
    dlg.showModal();
  }
  $('open-add').addEventListener('click', openAdd);
  $('add-cancel').addEventListener('click', () => dlg.close());
  $('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const text = String(f.get('text') || '').trim();
    if (text.length < 3) { $('add-msg').textContent = 'Describe the change in a few words.'; return; }
    const pid = projectId || (board.projects.length === 1 ? board.projects[0].id : '');
    if (!pid) { $('add-msg').textContent = 'Pick a project at the top first.'; return; }
    const files = String(f.get('files') || '').split(',').map((s) => s.trim()).filter(Boolean);
    const task = { title: shortTitle(text.split('\n').find((line) => line.trim()) || text), prompt: text };
    if (files.length) task.files = files;
    if (f.get('tier')) task.tier = f.get('tier');
    if (f.get('after')) task.after = [f.get('after')];
    $('add-submit').disabled = true;
    try {
      const r = await rpc('task.add', { projectId: pid, tasks: [task], createdBy: 'dashboard' });
      if (r.created.length) { toast('Queued: ' + shortTitle(r.created[0].title, 60)); dlg.close(); e.target.reset(); refresh(); }
      else if (r.duplicates.length) $('add-msg').textContent = `This looks the same as “${shortTitle(r.duplicates[0].existingTitle)}”, which is already queued.`;
    } catch (err) { if (!authFailed) $('add-msg').textContent = err.message; }
    finally { if (!authFailed) $('add-submit').disabled = false; }
  });

  // ---------- cleanup ----------
  $('clean-preview').addEventListener('click', async () => {
    try {
      const plan = await rpc('clean.plan', projectId ? { projectId } : {});
      const box = $('clean');
      const parts = [];
      const freed = plan.remove.reduce((n, i) => n + (i.bytes || 0), 0);
      const size = freed >= 1e9 ? (freed / 1e9).toFixed(1) + ' GB' : Math.round(freed / 1e6) + ' MB';
      parts.push(el('p', {}, plan.remove.length ? `${plan.remove.length} item(s) can be removed${freed > 1e6 ? `, freeing about ${size}` : ''}:` : 'Nothing to remove. Everything is tidy.'));
      if (plan.remove.length) parts.push(el('ul', { class: 'clean-list' }, plan.remove.slice(0, 12).map((i) => el('li', {}, `${i.reason}`))));
      if (plan.keep.length) parts.push(el('p', {}, `Kept on purpose (${plan.keep.length}):`), el('ul', { class: 'clean-list keep' }, plan.keep.slice(0, 12).map((i) => el('li', {}, `${clip(i.target.split('/').pop(), 40)}: ${i.reason}`))));
      box.replaceChildren(...parts);
      $('clean-run').hidden = !plan.remove.length;
    } catch (e) { toast(e.message); }
  });
  $('clean-run').addEventListener('click', async () => {
    try {
      const r = await rpc('clean.run', projectId ? { projectId } : {});
      toast(`Removed ${r.removed.length} item(s)` + (r.failed.length ? `, kept ${r.failed.length} that changed` : ''));
      $('clean').replaceChildren(); $('clean-run').hidden = true;
    } catch (e) { toast(e.message); }
  });

  const pauseAsk = $('pause-ask');
  $('pause-btn').addEventListener('click', () => { pauseAsk.hidden = false; $('pause-soft').focus(); });
  $('pause-cancel').addEventListener('click', () => { pauseAsk.hidden = true; $('pause-btn').focus(); });
  const doPause = async (now) => {
    pauseAsk.hidden = true;
    try { await rpc('fleet.pause', { projectId: projectId || null, stopRunning: now, by: 'dashboard' }); toast(now ? 'Paused. Stop requested for coding; checks and reviews can finish.' : 'Paused. Running agents can finish first.'); refresh(); } catch (e) { toast(e.message); }
  };
  $('pause-soft').addEventListener('click', () => doPause(false));
  $('pause-now').addEventListener('click', () => doPause(true));
  $('resume-btn').addEventListener('click', async () => {
    try { await rpc('fleet.resume', { projectId: projectId || null, by: 'dashboard' }); toast('Resumed'); refresh(); } catch (e) { toast(e.message); }
  });

  $('project').addEventListener('change', (e) => {
    closeDrawer(); projectId = e.target.value; localStorage.setItem('ym-project', projectId);
    registry = null; registryError = ''; board = null; feed.length = 0; feedAll = false;
    $('registry').replaceChildren(); $('board').replaceChildren(); $('att-list').replaceChildren(); $('attention').hidden = true; $('machines').replaceChildren(); $('sessions').textContent = ''; renderFeed();
    const scope = projectId;
    refresh(); rpc('events.since', { after: 0, limit: 60, projectId: scope || null }).then(events => { if (scope === projectId) pushEvents(events); }).catch(() => {});
  });

  refresh();
  stream();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
